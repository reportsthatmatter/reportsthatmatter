report: uk-stern-review
status: approved

why_it_matters: >-
  Sir Nicholas Stern's review of the economics of climate change, written
  for the UK Treasury and published in October 2006. It set the costs of
  climate change against the costs of acting on it, and concluded that the
  benefits of strong, early action "considerably outweigh the costs".
  Published here in November 2026, twenty years on and as COP31 meets: its
  Executive Summary in its own words, with the estimates, the reasoning and
  the policies it proposed.

description: >-
  The Stern Review (2006) on the economics of climate change: its Executive
  Summary, citable paragraph by paragraph.

background: |
  In July 2005 the Chancellor of the Exchequer, Gordon Brown, asked Sir
  Nicholas Stern, then Head of the Government Economic Service and a former
  Chief Economist of the World Bank, to review the economics of climate
  change. The Review, which describes itself as independent, was based in HM
  Treasury and reported to the Prime Minister, Tony Blair, and to the
  Chancellor. It was a review commissioned by government, not a statement
  of government policy. It invited submissions, met economists, scientists,
  policy-makers, business and NGOs in a dozen countries, and drew wherever
  it could on existing research.

  It was published on 30 October 2006, in six parts, with this 27-page
  Executive Summary stating its argument and conclusions. The summary itself
  warns that its estimates "should not be endowed with a precision and
  certainty that is simply impossible to achieve". Cambridge
  University Press published it as a book in January 2007. The rest of the
  Review is not yet on this site.

  Its estimates were argued over from the start. Economists, among them
  William Nordhaus, criticised the low rate at which it discounted harm to
  future generations, which weighs future losses heavily against costs paid
  now; the full Review argues for that choice on ethical grounds. In June 2008 Stern
  said the costs of acting had risen, and put the annual cost of stabilising
  greenhouse gases at about 2% of GDP, double the Review's estimate. The
  Executive Summary is published here as the UN climate conference COP31
  meets in Antalya, Türkiye, from 9 to 20 November 2026.

findings:
  - text: The Review's central conclusion, reached by three different methods (the physical impacts and the costs of cutting emissions, economic models, and the social cost of carbon against the cost of abatement), is that the benefits of strong, early action outweigh the costs.
    cites: [from-all-these-perspectives-evidence, review-considers-economic-costs-impacts]
    excerpt:
      paragraph: from-all-these-perspectives-evidence
      quote: >-
        From all of these perspectives, the evidence gathered by the Review
        leads to a simple conclusion: the benefits of strong, early action
        considerably outweigh the costs.

  - text: It estimates that unchecked climate change would cost the equivalent of at least 5% of global consumption per head, "now and forever", and between 5% and 20% once wider risks and impacts are counted, with the upper part of that range the more likely.
    cites: [using-model-including-those-elements, summary-analyses-take-into-account, putting-these-additional-factors-together]
    excerpt:
      paragraph: summary-analyses-take-into-account
      quote: >-
        In summary, analyses that take into account the full ranges of both
        impacts and possible outcomes - that is, that employ the basic economics
        of risk - suggest that BAU climate change will reduce welfare by an
        amount equivalent to a reduction in consumption per head of between 5
        and 20%. Taking account of the increasing scientific evidence of
        greater risks, of aversion to the possibilities of catastrophe, and of
        a broader approach to the consequences than implied by narrow output
        measures, the appropriate estimate is likely to be in the upper part of
        this range.

  - text: Against that, it estimates the annual cost of stabilising greenhouse gases at 500-550ppm CO2e at around 1% of GDP by 2050, and finds a high price to delay.
    cites: [achieving-these-deep-cuts-emissions, important-corollary-there-high-price]
    excerpt:
      paragraph: achieving-these-deep-cuts-emissions
      quote: >-
        Achieving these deep cuts in emissions will have a cost. The Review
        estimates the annual costs of stabilisation at 500-550ppm CO2e to be
        around 1% of GDP by 2050 - a level that is significant but manageable.

  - text: It calls climate change "a unique challenge for economics", a market failure that is global, long-term and uncertain.
    cites: [climate-change-presents-unique-challenge]
    excerpt:
      paragraph: climate-change-presents-unique-challenge
      quote: >-
        Climate change presents a unique challenge for economics: it is the
        greatest and widest-ranging market failure ever seen.

  - text: It finds that the poorest countries and people will suffer earliest and most, though they have contributed little to the problem, and that the international community has an obligation to help them adapt.
    cites: [impacts-climate-change-are-not, climate-change-grave-threat-developing, poorest-developing-countries-will-be]

  - text: It proposes three elements of policy for cutting emissions (a carbon price, technology policy and the removal of barriers to behavioural change), and finds that leaving out any one of them would raise the cost.
    cites: [three-elements-policy-mitigation-are, putting-appropriate-price-carbon-explicitly]

  - text: It calls for international collective action, through a broadly similar carbon price around the world, carbon finance for developing countries, co-operation on technology, action on deforestation (which it estimates at more than 18% of global emissions) and support for adaptation.
    cites: [effective-response-climate-change-will, creating-broadly-similar-carbon-price, emissions-from-deforestation-are-very]

reading_guide:
  - section: executive-summary
    why: >-
      The whole summary is one section of 27 pages. Its findings are the
      sentences in bold italic: read those first for the argument, then the
      impacts and costs of climate change (pp. iii-x), the costs of action (pp. xi-xvii) and the
      policies (pp. xviii-xxvii).
    excerpt:
      paragraph: evidence-shows-ignoring-climate-change
      quote: >-
        Our actions over the coming few decades could create risks of major
        disruption to economic and social activity, later in this century and
        in the next, on a scale similar to those associated with the great wars
        and the economic depression of the first half of the 20th century.

