# Our layer on this report: its landing page. Everything here is ours and is
# shown labelled as ours. Every quote is verbatim from the rendered report and
# is checked by `pnpm editorial`; every id must resolve.
#
#   why_it_matters  the standfirst, and the page's meta description
#   background      what happened, and where this report sits in it
#   findings        what it found; a few carry a key quotation
#   reading_guide   where to start reading, section by section
#   highlights      editor's highlights: seeded into the marks table, not printed here
#
# Written 2026-11-08 (reportsthatmatter-gqsy.9), for the Executive Summary; reading
# guide extended 2026-11-12 (gqsy.9.2) to the Summary of Conclusions and Chapters
# 2, 6, 9, 10 and 13, and 2026-11-13 to Chapters 1, 3-5, 7 and 8 (Chapter 9 now its
# own section, owre). Our words neutral and attributed ("the Review
# estimates"), every judgment in the report's own words and in quotation marks.
# The Review's figures are estimates made in 2006; the background records the
# economists' main objection (the discount rate) and Stern's own 2008 revision,
# as dated facts with their sources.
#
# Facts taken from the report itself: commissioned by the Chancellor, reporting
# to the Chancellor and the Prime Minister (ES p.i); announced in July 2005
# (Preface, p.i, in the full report's Preface_and_Acknowledgements.pdf); its
# estimates (5% and 20% of consumption, 1% of GDP, $85 per tonne, 18% from
# deforestation); its three elements of policy.
#
# Sources for the background facts that are not in the report (checked 2026-11-08):
#   From the full report's Preface (Preface_and_Acknowledgements.pdf, p.i): submissions
#     invited 10 October 2005 to 15 January 2006; visits to Brazil, Canada, China, the
#     European Commission, France, Germany, India, Japan, Mexico, Norway, Russia, South
#     Africa and the USA; "economists, scientists, policy-makers, business and NGOs";
#     "Wherever possible, we have based our Review on gathering and structuring existing
#     research material." Chapter 2 (Economics, Ethics and Climate Change) argues the
#     discounting choice on ethical grounds.
#   Announced by Chancellor Gordon Brown in July 2005; reported to the Prime
#     Minister (Tony Blair) and the Chancellor; Stern was Head of the Government
#     Economic Service; CUP published it as a book in January 2007
#     (lse.ac.uk/granthaminstitute/explainers/what-is-the-stern-review/).
#   Stern, World Bank Chief Economist 2000-2003; Baron Stern of Brentford, 2007
#     (en.wikipedia.org/wiki/Nicholas_Stern,_Baron_Stern_of_Brentford).
#   The 0.1% pure rate of time preference and Nordhaus's criticism of the low
#     discount rate: Nordhaus, "A Review of the Stern Review on the Economics of
#     Climate Change", Journal of Economic Literature 45(3), 2007
#     (doi.org/10.1257/jel.45.3.686), via en.wikipedia.org/wiki/Stern_Review.
#   June 2008: Stern raised his estimate of the annual cost of stabilisation to
#     about 2% of GDP (Guardian, 26 June 2008, as reported by IEMA, 3 July 2008:
#     iema.net/resources/news/2008/07/03/iema-cost-of-tackling-global-climate-change-has-doubled-warns-stern).
#   COP31: Antalya, Türkiye, 9-20 November 2026
#     (unccd.int/index.php/events/other/2026-un-climate-change-conference-cop31;
#     pm.gov.au/media/cop-be-hosted-turkiye-australia-leading-negotiations).
# Left out as not verified to a source: any causal link to the Climate Change Act 2008.
# Fact-check by a subagent, 2026-11-08. "Six parts": HM Treasury's report page lists
#   Parts I-VI (stern_review_report.htm, Wayback 2009). Critiqued by a Fable reviewer
#   (2026-11-08, agent protocol 2026-10-24); its points applied.

