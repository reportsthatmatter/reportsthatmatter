why_it_matters: >-
  Sir Nicholas Stern's review of the economics of climate change, written
  for the UK Treasury and published in October 2006. It set the costs of
  climate change against the costs of acting on it, and concluded that the
  benefits of strong, early action "considerably outweigh the costs".
  Published here in November 2026, twenty years on and as COP31 meets: its
  Executive Summary and Summary of Conclusions, and the chapters behind its
  best-known numbers, in its own words, with the estimates, the reasoning
  and the policies it proposed.

description: >-
  The Stern Review (2006) on the economics of climate change: its Executive
  Summary, Summary of Conclusions and key chapters, citable paragraph by
  paragraph.

background: |
  In July 2005 the Chancellor of the Exchequer, Gordon Brown, asked Sir
  Nicholas Stern, then Head of the Government Economic Service and a former
  Chief Economist of the World Bank, to review the economics of climate
  change. The Review, which describes itself as independent, was based in HM
  Treasury and reported to the Prime Minister, Tony Blair, and to the
  Chancellor. It was a review commissioned by government, not a statement
  of government policy. It invited submissions, met economists, scientists,
  policy-makers, business and NGOs in a dozen countries, and drew wherever
  it could on existing research.

  It was published on 30 October 2006, in six parts, with this 27-page
  Executive Summary stating its argument and conclusions. The summary itself
  warns that its estimates "should not be endowed with a precision and
  certainty that is simply impossible to achieve". Cambridge
  University Press published it as a book in January 2007. This site has
  the Executive Summary, the Preface, Introduction and Summary of
  Conclusions, and Chapters 1 to 10 and 13; the other chapters are to
  follow.

  Its estimates were argued over from the start. Economists, among them
  William Nordhaus, criticised the low rate at which it discounted harm to
  future generations, which weighs future losses heavily against costs paid
  now; the full Review argues for that choice on ethical grounds. In June 2008 Stern
  said the costs of acting had risen, and put the annual cost of stabilising
  greenhouse gases at about 2% of GDP, double the Review's estimate. The
  Executive Summary is published here as the UN climate conference COP31
  meets in Antalya, Türkiye, from 9 to 20 November 2026.

findings:
  - text: The Review's central conclusion, reached by three different methods (the physical impacts and the costs of cutting emissions, economic models, and the social cost of carbon against the cost of abatement), is that the benefits of strong, early action outweigh the costs.
    cites: [from-all-these-perspectives-evidence, review-considers-economic-costs-impacts]
    excerpt:
      paragraph: from-all-these-perspectives-evidence
      quote: >-
        From all of these perspectives, the evidence gathered by the Review
        leads to a simple conclusion: the benefits of strong, early action
        considerably outweigh the costs.

  - text: It estimates that unchecked climate change would cost the equivalent of at least 5% of global consumption per head, "now and forever", and between 5% and 20% once wider risks and impacts are counted, with the upper part of that range the more likely.
    cites: [using-model-including-those-elements, summary-analyses-take-into-account, putting-these-additional-factors-together]
    excerpt:
      paragraph: summary-analyses-take-into-account
      quote: >-
        In summary, analyses that take into account the full ranges of both
        impacts and possible outcomes - that is, that employ the basic economics
        of risk - suggest that BAU climate change will reduce welfare by an
        amount equivalent to a reduction in consumption per head of between 5
        and 20%. Taking account of the increasing scientific evidence of
        greater risks, of aversion to the possibilities of catastrophe, and of
        a broader approach to the consequences than implied by narrow output
        measures, the appropriate estimate is likely to be in the upper part of
        this range.

  - text: Against that, it estimates the annual cost of stabilising greenhouse gases at 500-550ppm CO2e at around 1% of GDP by 2050, and finds a high price to delay.
    cites: [achieving-these-deep-cuts-emissions, important-corollary-there-high-price]
    excerpt:
      paragraph: achieving-these-deep-cuts-emissions
      quote: >-
        Achieving these deep cuts in emissions will have a cost. The Review
        estimates the annual costs of stabilisation at 500-550ppm CO2e to be
        around 1% of GDP by 2050 - a level that is significant but manageable.

  - text: It calls climate change "a unique challenge for economics", a market failure that is global, long-term and uncertain.
    cites: [climate-change-presents-unique-challenge]
    excerpt:
      paragraph: climate-change-presents-unique-challenge
      quote: >-
        Climate change presents a unique challenge for economics: it is the
        greatest and widest-ranging market failure ever seen.

  - text: It finds that the poorest countries and people will suffer earliest and most, though they have contributed little to the problem, and that the international community has an obligation to help them adapt.
    cites: [impacts-climate-change-are-not, climate-change-grave-threat-developing, poorest-developing-countries-will-be]

  - text: It proposes three elements of policy for cutting emissions (a carbon price, technology policy and the removal of barriers to behavioural change), and finds that leaving out any one of them would raise the cost.
    cites: [three-elements-policy-mitigation-are, putting-appropriate-price-carbon-explicitly]

  - text: It calls for international collective action, through a broadly similar carbon price around the world, carbon finance for developing countries, co-operation on technology, action on deforestation (which it estimates at more than 18% of global emissions) and support for adaptation.
    cites: [effective-response-climate-change-will, creating-broadly-similar-carbon-price, emissions-from-deforestation-are-very]

reading_guide:
  - section: executive-summary
    why: >-
      The Review's own account of its argument, in 27 pages. Its findings are
      the sentences in bold italic: read those first for the argument, then
      the impacts and costs of climate change (pp. iii-x), the costs of action
      (pp. xi-xvii) and the policies (pp. xviii-xxvii).
    excerpt:
      paragraph: evidence-shows-ignoring-climate-change
      quote: >-
        Our actions over the coming few decades could create risks of major
        disruption to economic and social activity, later in this century and
        in the next, on a scale similar to those associated with the great wars
        and the economic depression of the first half of the 20th century.
  - section: summary-of-conclusions
    why: >-
      The shortest statement of the Review's conclusions, four pages headed by
      six findings in bold italic: the costs of inaction and of action, the
      price of delay, and what international action should include.
    excerpt:
      paragraph: using-results-from-formal-economic
      quote: >-
        Using the results from formal economic models, the Review estimates
        that if we don't act, the overall costs and risks of climate change
        will be equivalent to losing at least 5% of global GDP each year, now
        and forever.
  - section: 1-the-science-of-climate-change-scale-of-the-environment-challenge
    why: >-
      Chapter 1 sets out the science the Review relies on: how greenhouse
      gases warm the Earth, how much warming different concentrations are
      likely to bring, and the feedbacks and abrupt changes that could add to
      it.
    excerpt:
      paragraph: most-climate-models-show-doubling
      quote: >-
        Most climate models show that a doubling of pre-industrial levels of
        greenhouse gases is very likely to commit the Earth to a rise of
        between 2 – 5°C in global mean temperatures.
  - section: 2-economics-ethics-and-climate-change
    why: >-
      Chapter 2 sets out the economic and ethical framework, including how far
      to discount the welfare of future generations, the choice that critics
      such as William Nordhaus challenged.
    excerpt:
      paragraph: yet-assessing-impacts-over-very
      quote: >-
        We take a simple approach in this Review: if a future generation will
        be present, we suppose that it has the same claim on our ethical
        attention as the current one.
  - section: 3-how-climate-change-will-affect-people-around-the-world
    why: >-
      Chapter 3 goes through the impacts degree by degree: on water, food,
      health, land and the environment, and the risk of abrupt and
      large-scale changes. Its Table 3.1, which sets them out by degree of
      warming, is in the PDF only.
    excerpt:
      paragraph: climate-change-threatens-basic-elements-2
      quote: >-
        Climate change threatens the basic elements of life for people around
        the world – access to water, food, health, and use of land and the
        environment.
  - section: 4-implications-of-climate-change-for-development
    why: >-
      Chapter 4 turns to the developing world, where the Review finds the
      impacts will fall earliest and hardest, region by region.
  - section: 5-costs-of-climate-change-in-developed-countries
    why: >-
      Chapter 5 does the same for the developed world: some gains at first
      in higher latitudes, then growing costs from water stress, extreme
      weather and the strain on insurance.
  - section: 6-economic-modelling-of-climate-change-impacts
    why: >-
      Chapter 6 is where the "5 to 20%" estimate of the cost of climate change
      is made, from the PAGE2002 model: 5% for the model's lower-bound
      scenario, and around 20% once three further factors are added, as below.
      Its key messages, on the first page, summarise the method and the
      results; its Table 6.1 is in the PDF only.
    excerpt:
      paragraph: putting-these-three-additional-factors
      quote: >-
        Putting these three additional factors together would increase the
        total cost of BAU climate change to the equivalent of around a 20%
        reduction in current per-capita consumption, now and forever.
  - section: part-iii-the-economics-of-stabilisation
    why: >-
      Part III's one-page introduction states the Review's estimate of the
      cost of action, annual, to 2050; the chapters that follow build it up.
    excerpt:
      paragraph: stabilisation-concentrations-will-require-deep
      quote: >-
        Overall costs are estimated at around 1% of GDP for stabilisation
        levels between 500-550ppm CO2e.
  - section: 7-projecting-the-growth-of-greenhouse-gas-emissions
    why: >-
      Chapter 7 sets out where emissions are heading if nothing is done, and why scarcer fossil fuels will not stop them in time.
    excerpt:
      paragraph: without-action-combat-climate-change
      quote: >-
        In a plausible 'business as usual' scenario, they will reach 550ppm
        CO2e by 2035, then increasing at 4½ppm per year and still
        accelerating.
  - section: 8-the-challenge-of-stabilisation
    why: >-
      Chapter 8 sets out what stabilising greenhouse gases would take: how
      soon emissions must peak, and how fast they must then fall.
    excerpt:
      paragraph: stabilisation-550-ppm-co2e-requires
      quote: >-
        Stabilisation at 550 ppm CO2e requires emissions to peak in the next
        10-20 years, and to decline at a substantial rate thereafter.
  - section: 9-identifying-the-costs-of-mitigation
    why: >-
      Chapter 9 builds up the cost of cutting emissions technology by
      technology, with the range around it; Chapter 10 compares it with the
      economic models.
    excerpt:
      paragraph: global-cost-reducing-total-ghg
      quote: >-
        The global cost of reducing total GHG emissions to three quarters of
        current levels (consistent with 550ppm CO2e stabilisation trajectory)
        is estimated at around $1 trillion in 2050 or 1% of GDP in that year,
        with a range of –1.0% to 3.5% depending on the assumptions made.
  - section: 10-macroeconomic-models-of-costs
    why: >-
      Chapter 10 compares the Review's estimate with the costs found by
      economic models of the whole economy.
    excerpt:
      paragraph: overall-expected-annual-cost-achieving
      quote: >-
        Overall, the expected annual cost of achieving emissions reductions,
        consistent with an emissions trajectory leading to stabilisation at
        around 500-550ppm CO2e, is likely to be around 1% of GDP by 2050, with
        a range of +/- 3%, reflecting uncertainties over the scale of
        mitigation required, the pace of technological innovation and the
        degree of policy flexibility.
  - section: 13-towards-a-goal-for-climate-change-policy
    why: >-
      Chapter 13 sets the costs against the damages to choose a goal for
      policy, and arrives at the range for stabilisation the Review
      recommends.
    excerpt:
      paragraph: current-evidence-suggests-aiming-stabilisation-2
      quote: >-
        The current evidence suggests aiming for stabilisation somewhere within
        the range 450 - 550ppm CO2e.

highlights:
  - paragraph: from-all-these-perspectives-evidence
    quote: >-
      the evidence gathered by the Review leads to a simple conclusion: the
      benefits of strong, early action considerably outweigh the costs.
  - paragraph: climate-change-presents-unique-challenge
    quote: >-
      Climate change presents a unique challenge for economics: it is the
      greatest and widest-ranging market failure ever seen.
  - paragraph: achieving-these-deep-cuts-emissions
    quote: >-
      The Review estimates the annual costs of stabilisation at 500-550ppm
      CO2e to be around 1% of GDP by 2050 - a level that is significant but
      manageable.
  - paragraph: important-corollary-there-high-price
    quote: >-
      An important corollary is that there is a high price to delay.
  - paragraph: impacts-climate-change-are-not
    quote: >-
      The impacts of climate change are not evenly distributed - the poorest
      countries and people will suffer earliest and most.
  - paragraph: evidence-shows-ignoring-climate-change
    quote: >-
      Tackling climate change is the pro-growth strategy for the longer term,
      and it can be done in a way that does not cap the aspirations for growth
      of rich or poor countries.
  - paragraph: putting-these-additional-factors-together
    quote: >-
      Putting these additional factors together would increase the total cost
      of BAU climate change to the equivalent of around a 20% reduction in
      consumption per head, now and into the future.
  - paragraph: three-elements-policy-mitigation-are
    quote: >-
      Three elements of policy for mitigation are essential: a carbon price,
      technology policy, and the removal of barriers to behavioural change.
  - paragraph: emissions-from-deforestation-are-very
    quote: >-
      Emissions from deforestation are very significant – they are estimated
      to represent more than 18% of global emissions, a share greater than is
      produced by the global transport sector.
  - paragraph: poorest-developing-countries-will-be
    quote: >-
      The poorest developing countries will be hit earliest and hardest by
      climate change, even though they have contributed little to causing the
      problem.
  - paragraph: there-still-time-avoid-worst
    quote: >-
      There is still time to avoid the worst impacts of climate change if
      strong collective action starts now.
  - paragraph: evidence-shows-ignoring-climate-change
    quote: >-
      Our actions over the coming few decades could create risks of major
      disruption to economic and social activity, later in this century and in
      the next, on a scale similar to those associated with the great wars and
      the economic depression of the first half of the 20th century.
