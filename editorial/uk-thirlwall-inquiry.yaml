# Our layer on this report: its landing page. See editorial/jack-smith-vol1.yaml
# for the fields and docs/report-introductions.md for the rules. Every quote is
# verbatim from the rendered report and is checked by `pnpm editorial`; every id
# must resolve.
#
# Written 2026-10-25 (reportsthatmatter-gqsy.16.4) by thirlwall.
#
# Scope: the site holds the Summary report only (HC 601): Chapter 1
# (Introduction), Chapter 2 (The babies), Chapter 3 (Concerns, reviews, errors)
# and Chapter 4 (Part Two, the Chair's summaries of chapters 31 to 44). Volumes I
# to III, with the full findings and the 17 recommendations of Chapter 45, are
# not on the site yet.
#
# Care for the bereaved (decision 0026; the rules the Covid introduction followed,
# PR #381). Babies were killed and harmed, and their parents are a living affected
# community. Our text names no baby and no family, not even by the report's own
# letters, and quotes no parent: Chapter 2's testimony and every quotation of a
# parent or a victim impact statement is never quoted, highlighted or carded here.
# Every quotation and highlight is the Chair's own finding, about the hospital, its
# managers or the NHS. Deaths are counted only in the background, from the report's
# own paragraphs. There are no cards (no `card: true`): no excerpt from this report
# is to be queued until the courtesy emails go (reportsthatmatter-6j4h). Lucy Letby
# is named in our text only where the facts need it (her convictions and the CCRC
# review); she is in private_people so that `pnpm editorial` warns if her name ever
# reaches a card. The Inquiry's judgments are attributed to the Inquiry or the Chair,
# never stated as ours. Reporting Restriction Orders made in the Crown Court still
# apply (the Inquiry's release of 15 September 2026): we add no identifying detail.
#
# Background facts, checked 2026-10-25. From the report itself: deaths on the unit
# 2010-2016 (1.23, whose year-by-year list renders as a list under it, and 1.24-1.25); convictions for murdering seven babies (1.24, 1.25); the
# Chair's focus not on guilt or the convictions (1.3); balance of probabilities
# (1.2); Letby moved off the unit in July 2016 (1.25); police investigation opened
# 15 May 2017 (3.203); arrest in July 2018 (3.206); conviction in August 2023
# (3.60); one count of attempted murder retried and convicted (2.95); the Inquiry
# announced 4 September 2023 and established 19 October 2023 (3.210); counsel for
# the senior managers on hindsight (1.4). From elsewhere:
#   - The retrial verdict was in July 2024, and the Court of Appeal refused her
#     permission to appeal in May and October 2024: press reports of the Court of
#     Appeal's rulings (e.g. Express & Star, 24 May and 24 October 2024).
#   - Hearings: the Chair's opening remarks, 10 September 2024; oral evidence ended
#     January 2025; evidence and submissions closed 19 March 2025 (Inquiry news
#     posts of those dates, thirlwall.public-inquiry.uk/news). Oral hearings at
#     Liverpool Town Hall (Inquiry FAQ).
#   - The Chair refused an application by four former senior managers to pause the
#     Inquiry: ruling of 19 March 2025, published 21 March 2025 (Inquiry news post).
#   - 17 recommendations, in Chapter 45: the Inquiry's release of 15 September 2026,
#     https://thirlwall.public-inquiry.uk/2026/09/15/inquiry-report-finds-profound-failure-of-management-governance-and-safeguarding/
#   - Government: the Health and Social Care Secretary's oral statement and DHSC
#     press release of 15 September 2026 (gov.uk, "Government response to the
#     Thirlwall Inquiry"; "Government to act on Thirlwall patient safety
#     recommendations"): an apology on behalf of the government and the health
#     service, first measures including work on 'cot cams', and a full response
#     to follow.
#   - CCRC: an application on behalf of Ms Letby was received on 3 February 2025
#     (CCRC news, 4 February 2025); the Chair of the CCRC said on 13 February 2026
#     that "A review of Ms Letby's convictions is underway"
#     (https://ccrc.gov.uk/news/chairs-statement-on-lucy-letby-application-review).
#     No decision found on 25 October 2026. Re-check before any revision.

