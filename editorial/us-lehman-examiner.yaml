    card: true
  - paragraph: 2006-lehman-made-deliberate-decision
    quote: Rather than pull back, Lehman made the conscious decision to "double down," hoping to profit from a counter‐cyclical strategy.
    card: true
  - paragraph: lehman-s-business-model-not
    quote: Confidence was critical. The moment that repo counterparties were to lose confidence in Lehman and decline to roll over its daily funding, Lehman would be unable to fund itself and continue to operate.
  - paragraph: contemporaneous-lehman-e-mails-describe
    quote: Lehman's Global Financial Controller confirmed that "the only purpose or motive for [Repo 105] transactions was reduction in the balance sheet" and that "there was no substance to the transactions."
    card: true
  - paragraph: lehman-did-not-disclose-its
    quote: Lehman did not disclose its use – or the significant magnitude of its use – of Repo 105 to the Government, to the rating agencies, to its investors, or to its own Board of Directors.
  - paragraph: may-2008-lehman-senior-vice
    quote: Ernst & Young took no steps to question or challenge the non‐disclosure by Lehman of its use of $50 billion of temporary, off‐balance sheet transactions.
  - paragraph: lehman-did-not-publicly-disclose
