    quote: 'In an April 2008 e‐mail asking if he was familiar with the use of Repo 105 transactions to reduce net balance sheet, Bart McDade, Lehman''s former Head of Equities (2005–2008) and President and Chief Operating Officer (June–September 2008), replied: "I am very aware . . . it is another drug we r on."'
    card: true
  - paragraph: lehman-s-reliance-upon-repo
    quote: 'In another May 21, 2008 e‐mail, the head of Liquid Markets asked: "Are we going to make the FID Europe [balance sheet] target," which elicited the response: "V close . . . anything that moves is getting 105''d."'
