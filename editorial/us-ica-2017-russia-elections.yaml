# Our layer on this report: its landing page. Everything here is ours and is
# shown labelled as ours. Every quote is verbatim from the rendered report and
# is checked by `pnpm editorial`; every id must resolve.
#
#   why_it_matters  the standfirst, and the page's meta description
#   background      what happened, and where this report sits in it
#   findings        what it found; a few carry a key quotation
#   reading_guide   where to start reading, section by section
#   highlights      editor's highlights: seeded into the marks table, not printed here
#
# Written 2026-10-24 (reportsthatmatter-gqsy.13) to the rule of the Jack Smith and
# Mueller introductions: our words neutral and attributed ("the assessment finds"),
# every judgment in the report's own words and in quotation marks. A contested
# subject: the background states the later reviews as dated facts with their sources,
# and quotes neither side's characterisation.
#
# Sources for the background facts that are not in the report (checked 2026-10-24):
#   Obama directed the review on 9 December 2016, report due before 20 January
#     (govexec.com/oversight/2016/12/obama-orders-investigation-election-related-hacking/133794;
#     foxnews.com/politics/2016/12/09/obama-orders-review-election-hacking.html)
#   ODNI statement of 6 January 2017: President Obama, President-elect Trump and
#     congressional leaders had been briefed; a declassified version released
#     (intelligencecommunitynews.com/odni-releases-declassified-ic-assessment-of-russian-activities-and-intentions-in-recent-us-elections)
#   Senate Intelligence Committee, Volume 4, "Review of the Intelligence Community
#     Assessment", released 21 April 2020; both quotations below checked 2026-10-25
#     against the committee's own press release, "Key Findings" paragraph
#     (intelligence.senate.gov/press/senate-intel-releases-new-report-intel-community-assessment-russian-interference,
#     read via the Wayback Machine): "presents a coherent and well-constructed
#     intelligence basis for the case that Russia engaged in an attempt to interfere
#     with the 2016 U.S. presidential election" is verbatim; "analysts were under no
#     political pressure to reach specific conclusions" is verbatim, but there the
#     committee says interviews with the ICA's drafters "affirmed" it, so the
#     background attributes it that way. Full report: S. Rept. 116-290, Volumes I-V
#     (govinfo.gov/content/pkg/CRPT-116srpt290/pdf/CRPT-116srpt290.pdf), Volume 4
#     is a scanned image, so the press release is the checked text.
#   CIA tradecraft review, ordered by Director John Ratcliffe, declassified 2 July 2025:
#     "multiple procedural anomalies ... such as a compressed timeline, uneven access to
#     compartmented information, marginalization of the National Intelligence Council,
#     and excessive involvement of agency heads"
#     (cia.gov/stories/story/cia-director-john-ratcliffe-declassifies-internal-tradecraft-review)
# Critiqued by a Fable reviewer before shipping (2026-10-24, agent protocol 2026-10-24);
# its changes applied. The CIA page says nothing about the "aspired" judgment, so the
# background quotes the 2025 review only on what that page states.
# Facts taken from the report: its date, the three agencies, information as of
# 29 December 2016, the classified version, and that it made no assessment of the
# outcome.

