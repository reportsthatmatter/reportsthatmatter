# Our layer on this report: its landing page. See editorial/jack-smith-vol1.yaml
# for the fields and docs/report-introductions.md for the rules. Every quote is
# verbatim from the rendered report and is checked by `pnpm editorial`; every id
# must resolve.
#
# Scope: the site holds all seven volumes of the Phase 2 report (Volume 1 since
# 2026-10-04; Volumes 2-7 added 2026-11, reportsthatmatter-gqsy.4.2), less Volume 7's
# appendices. Findings cite the Panel's executive summary (Chapter 2) and, where it
# helps, the chapter in a later volume where the detail is. The recommendations are
# Part 14, Chapter 113, in Volume 7.
#
# Count not printed by the report: "58 recommendations" is the government response's
# count (verified 2026-10-04, below); Chapter 113 has 58 sentences that open "we
# recommend", "we therefore recommend" or "we also recommend" (counted 2026-11-12).
#
# Tone: this concerns the deaths of 72 people. Our words stay plain and attributed;
# the report's own words carry its conclusions. Part 9 (Volume 6, the deceased) is
# pointed to with care: no quotation from it names a person or describes a death
# (decision 0026); the reading guide quotes only its introduction's statement of
# purpose. No new card: true highlights.
#
# Background facts not stated in Volume 1, verified 2026-10-04:
#   - 72 people died, 18 of them children; the fire began in the kitchen of Flat 16
#     and spread up the outside of the building: the government's response to the
#     Phase 2 report (26 February 2025), paragraph 1 and the Deputy Prime Minister's
#     foreword:
#     https://www.gov.uk/government/publications/grenfell-tower-inquiry-phase-2-report-government-response/grenfell-tower-inquiry-phase-2-report-government-response-html
#   - The Inquiry was set up under the Inquiries Act 2005 with Sir Martin Moore-Bick
#     as Chairman: the same response, paragraph 2. (The report's own 1.27 says the
#     Inquiry was set up in June 2017.)
#   - Phase 2 report published 4 September 2024 in seven volumes: GOV.UK publication
#     page, https://www.gov.uk/government/publications/publication-of-the-grenfell-tower-inquiry-phase-2-report
#   - Government response published 26 February 2025 (GOV.UK content API,
#     first_published_at); "49 of the recommendations are being accepted in full by
#     the government and other responsible organisations", the other 9 ("all directed
#     at government") accepted in principle (re-checked by the reviewer 2026-10-04); "The government fully
#     supports the Metropolitan Police in its investigation": the response above.
#   The status of the criminal investigation was not checked beyond that, so the
#   background says nothing more about it.
#   Everything else is from the report's own Chapter 1 (1.1-1.27) and Chapter 2.

report: uk-grenfell-tower-inquiry
status: approved

why_it_matters: >-
  The report of the public inquiry into the fire at Grenfell Tower, London,
  on 14 June 2017, in which 72 people died. Across seven volumes the
  Panel sets out how the tower came to be clad in materials that let the fire
  spread, from government and the testing bodies to the firms that made, sold
  and fitted them. It also covers how the fire brigade and the authorities
  responded, the circumstances in which each person died, and the Panel's
  recommendations.

background: |
  In the early hours of 14 June 2017 a fire broke out in the kitchen of a flat in Grenfell Tower, a high-rise residential block in west London managed for the Royal Borough of Kensington and Chelsea (RBKC) by a tenant management organisation (the TMO). The tower had been refurbished between 2012 and 2016, when new cladding and insulation were fixed to its outside walls. The fire escaped from the flat into the external wall and spread rapidly up the outside of the building, and within a few hours it had engulfed almost all of it. 72 people died, 18 of them children.

  The Grenfell Tower Inquiry was set up in June 2017 under the Inquiries Act 2005, chaired by Sir Martin Moore-Bick, who sat for Phase 2 with two panel members, Ali Akbor and Thouria Istephan. Its Phase 1 report, published on 30 October 2019, set out what happened on the night. Phase 2 asked how the building came to be in a condition that allowed the fire to spread as it did. Its hearings began in January 2020 and ran to 312 days. The Phase 2 report was published on 4 September 2024 in seven volumes. A public inquiry may not rule on civil or criminal liability, and the Panel says it has not attempted, with some exceptions, to apportion blame.

  While the Inquiry sat, the report notes, the government banned metal composite panels with unmodified polyethylene cores on external walls and reformed building control. On 26 February 2025 the government published its response: 49 of the report's 58 recommendations were accepted in full, by the government and the other organisations responsible, and the other 9, all directed at government, in principle. The government said it fully supports the Metropolitan Police in its investigation.

findings:
  - text: The Panel concludes that the fire was the culmination of decades of failure by central government and others in the construction industry to look into the danger of combustible materials in the external walls of high-rise homes and to act on what they knew.
    cites: [2-4-we-conclude-fire, 29-3-our-view-between]
    excerpt:
      paragraph: 2-4-we-conclude-fire
      quote: >-
        We conclude that the fire at Grenfell Tower was the culmination of
        decades of failure by central government and other bodies in positions
        of responsibility in the construction industry to look carefully into
        the danger of incorporating combustible materials into the external
        walls of high-rise residential buildings and to act on the information
        available to them.

  - text: The report finds that the government department responsible for building regulations was warned about combustible cladding and insulation from 1999 onwards and did not amend or clarify its guidance, never published the results of a 2001 test in which aluminium composite panels with polyethylene cores burned violently, and, after the Lakanal House fire in south London in 2009, in which six people died, let a deregulatory agenda delay matters affecting the safety of life.
    cites: [2-5-years-between-fire, 2-6-department-also-failed, 2-7-many-subsequent-occasions, 2-13-years-followed-lakanal, 29-4-period-between-fire]

  - text: The report finds that the Building Research Establishment, which tested external wall systems, failed to tell the government clearly what its tests showed, and that weaknesses in its testing left it open to manipulation by manufacturers.
    cites: [2-15-bre-held-trusted, 2-16-although-bre-recognised, 2-18-there-weaknesses-way]

  - text: The Panel finds systematic dishonesty by the companies that made and sold the cladding panels and insulation used on the tower, Arconic, Celotex and Kingspan, and that the bodies that certified their products failed to check what they were told. The detail is in Part 3.
    cites: [2-19-one-very-significant, 2-21-arconic-architectural-products, 2-28-celotex-manufactured-rs5000, 2-37-when-did-return, 2-20-those-strategies-succeeded, 2-42-dishonest-strategies-arconic]
    excerpt:
      paragraph: 2-19-one-very-significant
      quote: >-
        One very significant reason why Grenfell Tower came to be clad in
        combustible materials was systematic dishonesty on the part of those who
        made and sold the rainscreen cladding panels and insulation products.
        They engaged in deliberate and sustained strategies to manipulate the
        testing processes, misrepresent test data and mislead the market.

  - text: The report finds that the choice of combustible materials for the refurbishment resulted from a series of errors by the organisations and individuals involved, each of whom assumed that someone else was responsible for fire safety; and that RBKC and the TMO showed a persistent indifference to fire safety in the years before the fire. The detail is in Parts 4 to 6.
    cites: [2-74-choice-combustible-materials, 67-13-if-construction-industry, 2-58-rbkc-tmo-jointly]
    excerpt:
      paragraph: 2-74-choice-combustible-materials
      quote: >-
        The choice of combustible materials for the cladding of Grenfell Tower
        resulted from a series of errors caused by the incompetence of the
        organisations and individuals involved in the refurbishment.

  - text: The report finds that the London Fire Brigade (LFB) had been forewarned by the Lakanal House fire of the shortcomings that appeared again on the night of the Grenfell Tower fire and had not put them right, and attributes that to its leadership and a culture of complacency; it echoes the Phase 1 finding that the firefighters on the night showed great courage.
    cites: [83-3-lfb-s-failure, 83-13-tragic-conclusion-lakanal, 83-1-phase-1-report]
    excerpt:
      paragraph: 83-3-lfb-s-failure
      quote: >-
        The evidence clearly shows that the LFB's failure was attributable to a
        chronic lack of effective leadership, combined with an undue emphasis on
        process and a culture of complacency.

  - text: The report finds that in the first week after the fire the response of the government and RBKC was slow and piecemeal, that many of those who had lost their homes or family members were left feeling abandoned, and that the local community and voluntary organisations provided support when the authorities did not.
    cites: [2-103-first-week-after, 107-1-no-response-emergency, 2-114-those-who-emerge]

  - text: Asked by some of those representing the bereaved, survivors and residents to examine whether race or social background played a part, the Panel reports some evidence of racial discrimination in how survivors were treated in the days after the fire, and no evidence that racial or social prejudice affected the decisions that created a dangerous building.
    cites: [1-22-we-should-say, 1-25-given-repeated-urging]

reading_guide:
  - section: chapter-2-executive-summary
    why: The Panel's own summary of all fourteen Parts of the report, from the regulatory regime to the response after the fire; the place to start (Volume 1).
    excerpt:
      paragraph: 2-1-chapter-contains-overview
      quote: >-
        The purpose of this chapter is to describe in broad terms the contents
        of the report and the main conclusions we have reached about the events
        that culminated in the tragedy at Grenfell Tower.

  - section: chapter-67-conclusions
    why: The Panel's conclusions on the refurbishment of 2012 to 2016 and the firms that designed and carried it out (Volume 4).
    excerpt:
      paragraph: 67-13-if-construction-industry
      quote: >-
        Regrettably, the Grenfell Tower refurbishment was marked by a serious
        lack of competence on the part of many of those engaged on it and, in
        the case of some manufacturers of construction products, outright
        dishonesty.

  - section: chapter-83-conclusions
    why: The Panel's conclusions on the London Fire Brigade, its leadership, and what it did with the lessons of the Lakanal House fire (Volume 5).

  - section: part-9-the-deceased
    why: The Panel's findings, floor by floor, on the circumstances in which each person who died lost their life, made to assist the coroner; its introduction explains what is recorded and why (Volume 6).
    excerpt:
      paragraph: 84-10-inquiry-opened-may
      quote: >-
        It is of the utmost importance that our description of the circumstances
        in which people died are placed in the larger context of their lives and
        the pictures of them painted at the memorial hearings. Only in that way
        can they be remembered as the people they really were.

  - section: chapter-107-conclusions
    why: The Panel's conclusions on how RBKC, the TMO, London and the government responded in the days after the fire, and on the local community that filled the gap (Volume 7).
    excerpt:
      paragraph: 107-1-no-response-emergency
      quote: >-
        No response to an emergency can be considered effective if it leaves
        those whom it is supposed to serve feeling abandoned and bereft.

  - section: part-14-recommendations
    why: The Panel's 58 recommendations, from a single construction regulator and a review of the statutory guidance to fire safety strategies, the fire service and the response to emergencies (Volume 7).
    excerpt:
      paragraph: 113-2-appears-from-findings
      quote: >-
        As appears from the findings in our report, we are satisfied that the
        system of regulating the construction and refurbishment of high-rise
        residential buildings that existed at the time of the Grenfell Tower
        fire was seriously defective in a number of respects.

highlights:
  - paragraph: 2-4-we-conclude-fire
    quote: >-
      We conclude that the fire at Grenfell Tower was the culmination of
      decades of failure by central government and other bodies in positions of
      responsibility in the construction industry to look carefully into the
      danger of incorporating combustible materials into the external walls of
      high-rise residential buildings and to act on the information available
      to them.
  - paragraph: 1-16-not-possible-identify
    quote: >-
      It is not possible to identify any single cause of the tragedy; many
      different acts and omissions combined to bring about the Grenfell Tower
      fire, although some were more significant than others.
  - paragraph: 2-19-one-very-significant
    quote: >-
      One very significant reason why Grenfell Tower came to be clad in
      combustible materials was systematic dishonesty on the part of those who
      made and sold the rainscreen cladding panels and insulation products.
    card: true
    tier: A
  - paragraph: 2-103-first-week-after
    quote: >-
      In the first week after the fire at Grenfell Tower the response of the
      government and RBKC was muddled, slow, indecisive and piecemeal.
    card: true
    tier: A
  - paragraph: 2-114-those-who-emerge
    quote: >-
      Those who emerge from the events with the greatest credit, and whose
      contribution only emphasised the inadequacies of the official response,
      are the members of the local community.
  - paragraph: 2-6-department-also-failed
    quote: >-
      The department also failed to pay due regard to the striking results of a
      large-scale test in 2001 involving aluminium composite panels with
      unmodified polyethylene cores, which burned violently, or to take any
      steps either to ascertain the extent to which panels of that kind were in
      use or to warn the construction industry about the risks they posed. It
      failed even to publish the results of the test.
  - paragraph: 2-7-many-subsequent-occasions
    quote: >-
      On many subsequent occasions the department was made aware that national
      Class 0 was an inappropriate standard by which to determine the
      suitability of external wall panels but allowed it to remain as part of
      the statutory guidance until after the Grenfell Tower fire. It could and
      should have been removed years earlier.
  - paragraph: 2-13-years-followed-lakanal
    quote: >-
      In the years that followed the Lakanal House fire the government's
      deregulatory agenda, enthusiastically supported by some junior ministers
      and the Secretary of State, dominated the department's thinking to such an
      extent that even matters affecting the safety of life were ignored,
      delayed or disregarded.
  - paragraph: 2-74-choice-combustible-materials
    quote: >-
      Everyone involved in the choice of the materials to be used in the
      external wall thought that responsibility for their suitability and
      safety lay with someone else.
  - paragraph: 7-94-no-one-able
    quote: >-
      We think that the explanation lies in the fact that having once been
      shelved they had subsequently been entirely forgotten.
  - paragraph: 10-92-way-which-department
    quote: >-
      The department never did do it and was never ready. Its failure was
      profound.
  - paragraph: 1-3-phase-2-we
    quote: >-
      In Phase 2 we have set out to answer the question that has been at the
      forefront of many people's minds: how was it possible in 21st century
      London for a reinforced concrete building, itself structurally impervious
      to fire, to be turned into a death trap that would enable fire to sweep
      through it in an uncontrollable way in a matter of a few hours despite
      what were thought to be effective regulations designed to prevent just
      such an event?
  - paragraph: 83-3-lfb-s-failure
    quote: >-
      The evidence clearly shows that the LFB's failure was attributable to a
      chronic lack of effective leadership, combined with an undue emphasis on
      process and a culture of complacency.
  - paragraph: 113-2-appears-from-findings
    quote: >-
      As appears from the findings in our report, we are satisfied that the
      system of regulating the construction and refurbishment of high-rise
      residential buildings that existed at the time of the Grenfell Tower fire
      was seriously defective in a number of respects.
