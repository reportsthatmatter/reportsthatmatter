# the roles of the individual agencies, Chapters 7 onwards) is not on the site.
#
# Tone: three young girls were murdered and many other children and adults were
# harmed. The report anonymises the child survivors (a Restriction Order of 6 July
# 2025) and never names the perpetrator ("the perpetrator" or AR); neither do we.
# Our text names the three girls only as the Foreword does, by first name, once.
# Nothing from Chapter 3 (the victims' portraits and impact statements) or from
# the account of the attack and the deaths in Chapter 4 is quoted, highlighted or
# put in the reading guide; findings about the day cite the Chair's conclusions
# only. No highlight is `card: true`: nothing from this report reaches the posting
# queue until the decision-0026 review and courtesy emails are sent
# (reportsthatmatter-6j4h). Tier A candidates for later, once 6j4h closes: the
# highlights on paragraphs 1.20, 1.52, 1.63 and 5.180.
