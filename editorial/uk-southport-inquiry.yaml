#     recommendations"; "The government agrees with all 67 recommendations made by
#     the Chair"; "accepts the recommendations that are for central government to
#     deliver"; Phase 2 will examine "the adequacy of arrangements for managing the
#     risk from violence fixated individuals": https://www.gov.uk/government/publications/southport-inquiry-phase-1-government-response
#     (PDF E03634467_Gov_resp_Southport_Inquiry_v02.pdf, Introduction paras 4-6, Foreword).
#   - Volume 2 "examines the roles and actions of the agencies involved": the PDF's
#     note on the two volumes, PDF p.7.
