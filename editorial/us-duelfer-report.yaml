#
# Written 2026-11-14 (reportsthatmatter-9br.1) for Volume I only (the Transmittal
# Message, Scope Note, Regime Strategic Intent, and Regime Finance and Procurement).
# Volumes II and III (delivery systems, nuclear, chemical, biological) and the 2005
# Addendums are not on the site yet (reportsthatmatter-d0h), so the findings stay
# within Volume I. Critiqued by a Fable reviewer before shipping; changes applied.
#
# Facts taken from the report itself: ISG created June 2003 by DOD under Maj. Gen.
# Keith Dayton, with US, UK and Australian staff (Scope Note p.1, Acknowledgements);
# David Kay Special Advisor June-December 2003 (Scope Note p.2); prewar planning
# assumed chemical and possibly biological stocks would be encountered (Scope Note
# p.1); "not an Intelligence Community product" (Acknowledgements p.2); detainee
# testimony to be weighed cautiously (Scope Note p.2, p.4); dated 30 September 2004
# (registry; Note for the Comprehensive Report p.1); addendums March 2005 (Note p.3).
#
# Sources for the background facts that are not in the report (checked 2026-11-14):
#   Kay to the Senate Armed Services Committee, 28 January 2004: "Let me begin by
#     saying we were almost all wrong, and I certainly include myself here."
#     (S. Hrg. 108-678, govinfo.gov/content/pkg/CHRG-108shrg96675/html/CHRG-108shrg96675.htm)
#   Duelfer named to succeed Kay on 23 January 2004; Deputy Executive Chairman of
#     UNSCOM from 1993 until its termination in 2000 (CIA press release, reprinted at
#     usinfo.org/wf-archive/2004/040123/epf504.htm)
#   Report made public on Wednesday 6 October 2004, when Duelfer and Brig. Gen. Joseph
#     McMenamin, the ISG's commander, testified to the Senate Armed Services Committee;
#     ISG then "approximately 1,750 people" (S. Hrg. 108-855,
#     govinfo.gov/content/pkg/CHRG-108shrg23081/html/CHRG-108shrg23081.htm;
#     pbs.org/newshour/nation/military-july-dec04-iraq_report_10-06)
#   Robb-Silberman Commission transmittal letter, 31 March 2005: "the Intelligence
#     Community was dead wrong in almost all of its pre-war judgments about Iraq's
#     weapons of mass destruction"
#     (georgewbush-whitehouse.archives.gov/wmd/text/transmittal_letter.html)

