why_it_matters: >-
  The final report of the Iraq Survey Group, the team of some 1,750 people sent to
  find Iraq's weapons of mass destruction after the 2003 invasion. Written by
  Charles Duelfer and made public in October 2004, it asks what became of the
  weapons, and why Saddam Husayn let the world believe he still had them. This is
  Volume I: the regime's intentions, and how it paid its way around UN sanctions.

description: >-
  The Iraq Survey Group's 2004 report on what became of Iraq's weapons of mass
  destruction. Volume I: Saddam Husayn's intentions, and the money that eroded UN
  sanctions.

background: |
  In March 2003 the United States, the United Kingdom and their allies invaded
  Iraq. The war's planners, the report records, assumed that chemical and possibly
  biological weapons were likely to be encountered and perhaps used. None were.
  In June 2003 the Defense Department set up the Iraq Survey Group, with American,
  British and Australian staff, to find out what had happened to Iraq's weapons
  programmes. Its first civilian head, David Kay, left in January 2004 and told the
  Senate Armed Services Committee: "we were almost all wrong, and I certainly
  include myself here."

  His successor, Charles Duelfer, had been deputy head of UNSCOM, the UN weapons
  inspection commission, from 1993 to 2000. His report is dated 30 September 2004
  and was made public on 6 October, when he presented it to the same committee. It
  draws on interviews with detained officials, including months of debriefing of
  Saddam Husayn himself, and on millions of captured documents. Duelfer calls it
  "my independent judgment", not an intelligence community product, and warns that
  detainees facing prosecution shaped what they said. The finance chapter names
  foreign companies and officials from Iraqi records, but says it does not judge
  them, and that some of the trade was legal under the UN's Oil-for-Food programme.

  The report was issued in three volumes; this is Volume I, on the regime's
  strategic intent and its finances. The later volumes on missiles and on nuclear,
  chemical and biological weapons are not yet on this site. In March 2005 the
  presidential commission chaired by Charles Robb and Laurence Silberman concluded
  that the intelligence community had been "dead wrong in almost all of its pre-war
  judgments about Iraq's weapons of mass destruction". The Duelfer report remains
  the fullest account of what the regime had, what it intended, and why the world
  misread it.

findings:
  - text: The report finds that Saddam alone set the regime's strategic intent, deciding policy on weapons of mass destruction by fiat and leaving little in writing. His aim was to end UN sanctions while keeping the ability to rebuild the weapons afterwards.
    cites: [saddam-husayn-so-dominated-iraqi, iraq-s-policymaking-national-security]
    excerpt:
      paragraph: saddam-husayn-so-dominated-iraqi
      quote: >-
        Saddam Husayn so dominated the Iraqi Regime that its strategic intent was
        his alone. He wanted to end sanctions while preserving the capability to
        reconstitute his weapons of mass destruction (WMD) when sanctions were
        lifted.

  - text: The Survey Group found no evidence that Iraq held stocks of such weapons in 2003, while leaving open the possibility that some existed, though not of military significance.
    cites: [isg-has-not-found-evidence, view-has-been-advanced-widely]
    excerpt:
      paragraph: isg-has-not-found-evidence
      quote: >-
        ISG has not found evidence that Saddam Husayn possessed WMD stocks in 2003,
        but the available evidence from its investigation—including detainee
        interviews and document exploitation—leaves open the possibility that some
        weapons existed in Iraq although not of a militarily significant capability.

  - text: It finds that Iraq was essentially free of militarily significant stocks by the mid-1990s, but that Saddam kept up an impression of possession, above all to deter Iran, which he saw as Iraq's abiding enemy.
    cites: [while-appears-iraq-mid-1990s-essentially, saddam-continued-see-utility-wmd, saddam-believed-wmd-necessary-counter]
    excerpt:
      paragraph: while-appears-iraq-mid-1990s-essentially
      quote: >-
        While it appears that Iraq, by the mid-1990s, was essentially free of
        militarily significant WMD stocks, Saddam’s perceived requirement to bluff
        about WMD capabilities made it too dangerous to clearly reveal this to the
        international community, especially Iran.

  - text: It finds that Saddam intended to restart the programmes once sanctions were lifted, that those around him did not believe he had given them up for good, and that he told officials to keep Iraq's weapons scientists employed.
    cites: [many-former-iraqi-officials-close, saddam-wanted-recreate-iraq-s, from-evidence-available-through-actions]

  - text: In the run-up to the 2003 war, the report finds, Saddam sent his own commanders mixed messages, first suggesting Iraq could use such weapons, then telling them it had none.
    cites: [senior-military-officers-former-regime, president-bush-s-speech-un]
    excerpt:
      paragraph: senior-military-officers-former-regime
      quote: >-
        Early on, Saddam sought to foster the impression with his generals that
        Iraq could resist a Coalition ground attack using WMD. Then, in a series of
        meetings in late 2002, Saddam appears to have reversed course and advised
        various groups of senior officers and officials that Iraq in fact did not
        have WMD.

  - text: It estimates that the regime earned $11.3 billion in illicit hard currency between August 1990 and March 2003, most of it, about $8 billion, through trade protocols with neighbouring states, and that it used secret oil allocations under the UN's Oil-for-Food programme, every name approved by Saddam, to win support against sanctions.
    cites: [during-un-sanctions-iraq-from, iraq-s-bilateral-trade-protocols, throughout-un-off-program-iraq]

  - text: It finds that this revenue funded a rebuilding of Iraq's military from 1997, peaking in 2001, including prohibited goods that crossed the borders with little difficulty.
    cites: [another-element-strategy-involved-circumventing, prohibited-goods-weapons-being-shipped]

  - text: The report leaves some questions open, among them reports that weapons material was moved out of Iraq before the war, and whether a mobile biological weapons capability existed.
    cites: [while-future-size-direction-iraq]

reading_guide:
  - section: transmittal-message
    why: Duelfer's own argument for reading the weapons as part of Saddam's wider ambitions, and from Saddam's point of view.
    excerpt:
      paragraph: readers-will-draw-their-own
      quote: >-
        The events surrounding Iraqi WMD have caused too much turmoil to be reduced
        to simple binary discussions of whether weapons existed at one moment in
        time versus another.
  - section: scope-note
    why: How the search was run, and what limited it, from looted sites to wary witnesses.
  - section: regime-strategic-intent
    why: The chapter's key judgments in two paragraphs, and how far the testimony of detained officials can be trusted.
  - section: desire-dominance-and-deterrence-through-wmd
    why: Why Saddam wanted the weapons, why Iran mattered most, and why he would not admit he no longer had them.
  - section: realizing-saddams-veiled-wmd-intent
    why: From 1991 to the invasion, ending with the evidence on what Iraq held in 2003 and the debriefings of Saddam's ministers.
    excerpt:
      paragraph: president-bush-s-speech-un
      quote: >-
        Huwaysh said he began to wonder whether Saddam had hidden something: “I
        knew a lot, but wondered why Bush believed that we had these weapons,” he
        said.
  - section: regime-finance-and-procurement
    why: How the regime raised money outside the UN's control and used it to buy goods and influence.

