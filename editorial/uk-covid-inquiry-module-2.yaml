# Our layer on this report: its landing page. See editorial/jack-smith-vol1.yaml
# for the fields and docs/report-introductions.md for the rules. Every quote is
# verbatim from the rendered report and is checked by `pnpm editorial`; every id
# must resolve.
#
# Written 2026-10-25 (reportsthatmatter-gqsy.14.1) by editorial-1025.
#
# Revised 2026-11-12 (reportsthatmatter-nshl) when Volume II was added.
#
# Scope: the site holds both volumes. Volume I (HC 1436-I, the text with the
# Inquiry's post-publication corrections of 16 January 2026): the Chair's
# introduction, the executive summary, the key themes, the recommendations in
# summary, and the chronological account in Chapters 1 to 8. Volume II (HC 1436-II,
# November 2025): Chapters 9 to 15 (themes and lessons) and the appendices, with the
# full text of the recommendations in Appendix 3. "19 recommendations": counted in
# Appendix 3 (Recommendation 1 to Recommendation 19), and the Inquiry's news release
# below says the same.
#
# Tone: this report concerns more than 230,000 deaths and the people left bereaved.
# Our words stay plain and attributed; the report's own words carry its conclusions.
# The "Voices" testimonies of bereaved people that follow the Chair's introduction
# are never quoted, highlighted or carded here; their names are in private_people
# so that `pnpm editorial` warns if one ever reaches a card. Death counts and
# estimates (the 23,000 figure) appear in findings only, never as cards (decision
# 0026, Tier C). Cards are Tier A only: an institution as subject, standing alone.
#
# Background facts not stated in Volume I, checked 2026-10-25:
#   - The Inquiry was established in June 2022: UK Government Response to the
#     Covid-19 Inquiry Module 2 Report (CP 1534, March 2026), Introduction,
#     https://assets.publishing.service.gov.uk/media/69c3d6bd4a06660f08544159/UK_Government_Response_to_the_Covid-19_Inquiry_Module_2_Report.pdf
#   - Module 2 is "the second of its 10 investigations"; "Nine weeks of public
#     hearings featuring 80 witnesses were held in London in autumn and winter
#     2023. A further 90 witnesses gave evidence in public hearings in Edinburgh,
#     Cardiff and Belfast in the first half of 2024"; "19 key recommendations":
#     the Inquiry's news release of 20 November 2025,
#     https://covid19.public-inquiry.uk/news/inquiry-publishes-second-report-and-19-recommendations-examining-core-uk-decision-making-and-political-governance/
#   - Module 1 report published 18 July 2024: the Inquiry's Module 1 report page,
#     https://www.covid19.public-inquiry.uk/documents/module-1-full-report/
#   - UK government response, March 2026: "the government broadly agrees with the
#     Chair's recommendations and sets out actions to address all of them" (CP 1534,
#     Introduction, as above). Responses by the devolved governments were not
#     checked, so the background names only the UK government's.
#   From the report itself: over 230,000 deaths and the 69 days of hearings, 166
#   witnesses, 53 Core Participants (Chair's introduction); England's third lockdown
#   from 4 January 2021 (7.82); restrictions ended 30 May 2022 (8.198); Mr Johnson's
#   view on earlier restrictions (4.187); 20 November 2025 and
#   Volume II (the executive summary and key themes).

