report: us-911-commission
status: draft

why_it_matters: >-
  The bipartisan Commission's account of how nineteen al Qaeda hijackers
  killed 2,973 people on 11 September 2001, and of the failures across the
  government that let them succeed. Congress created it to find out what
  happened and why; it interviewed more than 1,200 people and reported
  without dissent within two years. A quarter-century on, its central
  recommendations — a National Counterterrorism Center and a Director of
  National Intelligence — still shape how the United States organises
  against terrorism today.

background: |
  On the morning of 11 September 2001, nineteen hijackers directed by al
  Qaeda seized four commercial airliners taking off from airports on the
  East Coast. Two, American Airlines Flight 11 and United Airlines Flight
  175, were flown into the twin towers of the World Trade Center in New
  York; a third, American Airlines Flight 77, struck the Pentagon; the
  fourth, United Airlines Flight 93, crashed in a field near Shanksville,
  Pennsylvania, after its passengers fought to retake the cockpit. The
  Commission counted 2,973 dead.

  Congress and President George W. Bush created the National Commission on
  Terrorist Attacks Upon the United States by Public Law 107-306 on 27
  November 2002, directing it to investigate the facts and circumstances of
  the attacks across intelligence, law enforcement, aviation, diplomacy, and
  border security. Its ten members, five Republicans and five Democrats,
  were chaired by Thomas Kean, a former Republican governor of New Jersey,
  with Lee Hamilton, a former Democratic congressman from Indiana, as vice
  chairman. The Commission reviewed more than 2.5 million pages of
  documents, interviewed more than 1,200 people in ten countries, and held
  nineteen days of public hearings before reporting, without dissent, on 22
  July 2004.

  Its most far-reaching recommendations became law within the year: the
  Intelligence Reform and Terrorism Prevention Act, signed on 17 December
  2004, created a National Counterterrorism Center to plan and coordinate
  counterterrorism work across agencies, and a Director of National
  Intelligence to oversee the intelligence community as a whole — a role
  the Director of Central Intelligence had never had the authority to fill.
  Other recommendations were not adopted: the Commission's proposal to
  reorganise Congress's own oversight of intelligence into a single
  committee has never been carried out, and later congressional reviews
  have found the gap still open two decades on.

findings:
  - text: Nineteen hijackers directed by al Qaeda seized four passenger aircraft and turned them into weapons, defeating every layer of security then in place. The Commission put the day's toll at 2,973 dead, the largest loss of life to a hostile attack on American soil in the nation's history.
    cites: [19-men-aboard-four-transcontinental, september-11-nation-suffered-largest]
    excerpt:
      paragraph: september-11-nation-suffered-largest
      quote: >-
        On September 11, the nation suffered the largest loss of life—2,973—on
        its soil as a result of hostile attack in its history.

  - text: Intelligence agencies received a stream of warnings through the summer of 2001, including an August 6 briefing for President Bush titled "Bin Ladin Determined to Strike in US." Director of Central Intelligence George Tenet told the Commission that "the system was blinking red."
    cites: [during-spring-summer-2001-president, tenet-told-us-his-world]

  - text: In August 2001 an FBI agent in Minneapolis suspected that a detained flight-school student, Zacarias Moussaoui, might be planning to hijack a plane. The report finds that the Minneapolis agents failed to persuade FBI headquarters that there was enough evidence to seek a warrant to search his computer before 11 September.
    cites: [fbi-agent-who-handled-case, there-substantial-disagreement-between-minneapolis, fbi-also-learned-after-9]

  - text: The CIA followed two future hijackers, Khalid al Mihdhar and Nawaf al Hazmi, to a meeting in Kuala Lumpur in January 2000 and then lost their trail. The report finds that no one alerted the immigration service or the FBI; the two arrived unnoticed in Los Angeles on 15 January 2000, and were not put on the State Department's watchlist until 24 August 2001.
    cites: [consider-example-case-mihdhar-hazmi, unfortunately-there-no-evidence-any, divided-up-work-mary-asked]

  - text: Rather than assign blame to any single office or official, the Commission concluded that the attacks succeeded because of four kinds of failure — failures of imagination, policy, capabilities, and management — and that imagination was the hardest of the four to build into routine practice.
    cites: [we-believe-9-11-attacks, therefore-crucial-find-way-routinizing]
    excerpt:
      paragraph: we-believe-9-11-attacks
      quote: >-
        We believe the 9/11 attacks revealed four kinds of failures: in
        imagination, policy, capabilities, and management.

  - text: The report finds that the air defence of 11 September was improvised, by a military unprepared for airliners turned into weapons. Fighters scrambled from Otis Air Force Base did not know where to fly; NEADS received nine minutes' notice before the first plane hit its target, and no advance notice at all before the second, third, or fourth.
    cites: [summary-neads-received-notice-hijacking, clarifying-record-defense-u-s]

  - text: The Commission recommended a National Counterterrorism Center to replace the separate, uncoordinated analytic centers then run by the CIA, the FBI, the Defense Intelligence Agency, and the Department of Homeland Security, giving one center joint authority over both intelligence and operational planning.
    cites: [primary-responsibility-terrorism-analysis-has, recommendation-we-recommend-establishment-national]
    excerpt:
      paragraph: recommendation-we-recommend-establishment-national
      quote: >-
        We recommend the establishment of a National Counterterrorism Center
        (NCTC), built on the foundation of the existing Terrorist Threat
        Integration Center (TTIC).

  - text: It also recommended replacing the Director of Central Intelligence, a post that ran the CIA while holding little real authority over the other agencies it was meant to coordinate, with a National Intelligence Director responsible for the intelligence community as a whole.
    cites: [recommendation-current-position-director-central, there-are-disadvantages-separating-position]
    excerpt:
      paragraph: recommendation-current-position-director-central
      quote: >-
        The current position of Director of Central Intelligence should be
        replaced by a National Intelligence Director with two main areas of
        responsibility: (1) to oversee national intelligence centers on
        specific subjects of interest across the U.S. government and (2) to
        manage the national intelligence program and oversee the agencies that
        contribute to it.

reading_guide:
  - section: 11-inside-the-four-flights
    title: "1.1 Inside the Four Flights"
    why: Minute by minute, how four hijacked airliners boarded, took off, and defeated the security and air-defence systems in place that morning.
    excerpt:
      paragraph: 19-men-aboard-four-transcontinental
      quote: >-
        They were planning to hijack these planes and turn them into large
        guided missiles, loaded with up to 11,400 gallons of jet fuel. By
        8:00 A.M. on the morning of Tuesday, September 11, 2001, they had
        defeated all the security layers that America's civil aviation
        security system then had in place to prevent a hijacking.

  - section: the-system-was-blinking-red-81-the-summer-of-threat
    title: "8.1 The Summer of Threat"
    why: The wave of intelligence warnings in the months before 9/11, and how little of what worried Washington reached the FBI agents who had, without knowing it, already found one of the plot's operatives.
    excerpt:
      paragraph: there-substantial-disagreement-between-minneapolis
      quote: >-
        The supervisor replied that was precisely his intent. He said he was
        "trying to keep someone from taking a plane and crashing into the
        World Trade Center." The headquarters agent replied that this was
        not going to happen and that they did not know if Moussaoui was a
        terrorist.

  - section: 111-imagination
    title: "11.1 Imagination"
    why: The Commission's own diagnosis of why the attack succeeded — not one culprit but four kinds of failure — and why imagination was the hardest to build into routine practice.
    excerpt:
      paragraph: therefore-crucial-find-way-routinizing
      quote: >-
        It is therefore crucial to find a way of routinizing, even
        bureaucratizing, the exercise of imagination.

  - section: 131-unity-of-effort-across-the-foreign-domestic-divide
    title: "13.1 Unity of Effort Across the Foreign-Domestic Divide"
    why: The case for a National Counterterrorism Center, and how the Commission proposed it should work.
    excerpt:
      paragraph: recommendation-we-recommend-establishment-national
      quote: >-
        We recommend the establishment of a National Counterterrorism Center
        (NCTC), built on the foundation of the existing Terrorist Threat
        Integration Center (TTIC).

  - section: 132-unity-of-effort-in-the-intelligence-community
    title: "13.2 Unity of Effort in the Intelligence Community"
    why: The case for a National Intelligence Director in place of the Director of Central Intelligence, and what authority the new office would and would not have.
    excerpt:
      paragraph: recommendation-current-position-director-central
      quote: >-
        The current position of Director of Central Intelligence should be
        replaced by a National Intelligence Director with two main areas of
        responsibility: (1) to oversee national intelligence centers on
        specific subjects of interest across the U.S. government and (2) to
        manage the national intelligence program and oversee the agencies that
        contribute to it.

