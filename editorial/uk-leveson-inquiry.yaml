  - paragraph: 3-28-overall-justifications-advanced
    quote: >-
      Overall the justifications advanced by Messrs Hill and Desmond for the
      frankly appalling treatment of the McCanns were, as has been clearly
      demonstrated, both self-serving and without foundation.

  - paragraph: 3-12-if-ever-there
    quote: >-
      If ever there were an example of a story which ran totally out of
      control, this is one. The appetite for 'news' became insatiable, and
      once the original story had run its course the desire to find new
      leads and 'angles' began to take over, with their corollary
      tendencies of sensationalism and scandal.

  - paragraph: first-scale-problem-needs-be
    quote: >-
      The Inquiry has not unearthed extensive evidence of police corruption
      (noting, as it has done, the current position in relation to Operation
      Elveden which is concerned with payments to public officials
      generally); nor is there evidence satisfying the standard of proof I
      am applying to findings of fact in this Inquiry, namely the balance of
      probabilities, that significant numbers of police officers lack
      integrity in one or more of the respects I have examined earlier.

  - paragraph: suffice-say-bearing-mind-my
    quote: >-
      Suffice to say, bearing in mind my duty to consider the interests of
      the public, my view is that there would then be no alternative but to
      provide in legislation for a backstop regulator to apply and enforce a
      Code.
    card: true

  - paragraph: 7-8-challenge-goes-too
    quote: >-
      I simply do not accept that these provisions will have a chilling
      effect on free speech or press freedom.

  - paragraph: 1-1-press-complaints-commission
    quote: >-
      The Press Complaints Commission (PCC) has always been a voluntary
      system based on a network of implied contracts.

  - paragraph: 3-23-another-revealing-answer
    quote: >-
      This was another revealing answer, since by it Mr Desmond revealed
      what I consider to be a very disturbing philosophical approach to the
      concepts of free speech and a free press.
