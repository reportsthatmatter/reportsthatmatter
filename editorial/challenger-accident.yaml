# Our layer on this report: its landing page. See editorial/jack-smith-vol1.yaml
# for the fields and the rules. Every quote is verbatim from the rendered report
# (OCR quirks included) and is checked by `pnpm editorial`; every id must resolve.
#
# This is the House Committee on Science and Technology's report (House Report
# 99-1016), not the Rogers Commission's. The Committee reviewed the
# Commission's work and held its own hearings; the report says so itself
# (sections `introduction` and `challenger-investigation-hearings`).
#
# Extraction note: this report's contents page lists only its ten top-level
# chapters, not one of its many subsections, so most of the ~200 captions and
# OCR garble ("FIGURE", "W I L L NOT 1 SEAL", "Fletcher, the Solid Rocket Motor
# Source Evaluation Board (SEB)") that were mis-read as section headings have
# been dropped in the pipeline (reportsthatmatter-c1y, ingest.ts's
# `dropCaptionHeadings`); a residue of appendix noise remains. Two
# `reading_guide` entries below (`2-operations`, `technical-management-2`) used
# to point at the fake "FIGURE" sections that sat in front of the real ones;
# their `section:` was repointed once those fakes were removed, and their
# `title:` override is kept because "2. OPERATIONS" and the report's own
# capitals are not a reader-facing title on their own.
#
# The Conclusions' key sentence on "poor technical decision-making" is split
# between a block quotation and the next paragraph across a page break, so it
# cannot be quoted cleanly; it is paraphrased in findings instead. Filed as
# reportsthatmatter-m2y — Challenger should adopt @rtm/ingest's
# `pageBreakContinuations()` pass (reportsthatmatter-ca3), which is now
# declared in ingest.ts and fixes the parallel instance in Issue 2, Finding 2,
# but not this one: the quotation does not resume as a quotation on the next
# page, which is a shape that pass does not yet cover.
#
# Background facts not stated in the report itself, verified 2026-09-26:
#   - Challenger broke apart 73 seconds into flight; the seven crew, including
#     Christa McAuliffe of the Teacher in Space Project:
#     https://www.nasa.gov/challenger-sts-51l-accident/
#   - Rogers Commission: Executive Order 12546, chaired by William P. Rogers
#     (former Secretary of State); members included Neil Armstrong, Sally Ride
#     and Richard Feynman:
#     https://en.wikipedia.org/wiki/Rogers_Commission_Report
#   - Return to flight: STS-26, Discovery, 29 September 1988, after a 32-month
#     hiatus, with a redesigned SRB field joint:
#     https://www.nasa.gov/history/35-years-ago-sts-26-returns-the-space-shuttle-to-flight/
#   - Columbia Accident Investigation Board, August 2003: chapter 8, "History
#     as a Cause: Columbia and Challenger", and its finding of "reliance on past
#     success as a substitute for sound engineering practices":
#     https://www.nasa.gov/wp-content/uploads/static/history/columbia/reports/CAIBreportv1.pdf
#   Everything else (dates of the Commission's creation and report, the
#   Committee's hearings, approval and publication, the February 1987
#   deadline) is from the report itself.
#
# status: approved on Rufus's standing instruction to ship intros without review.

report: challenger-accident
status: approved

