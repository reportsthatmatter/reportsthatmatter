report: jack-smith-vol1
status: approved

why_it_matters: >-
  The Special Counsel's account of Donald Trump's attempt to overturn the 2020
  election. The case was dropped when he won the 2024 election, so it never
  reached a jury. This is the evidence prosecutors would have put before one,
  and their conclusion that it was enough to convict.

background: |
  Joe Biden won the presidential election of November 2020. Donald Trump, the
  sitting president, did not accept the result. Over the next two months he
  and his allies pressed state officials to change their counts, organised
  slates of electors in states he had lost, and pushed the Justice Department
  and Vice President Mike Pence to stop the result being certified. On 6
  January 2021, the day Congress met to certify it, a crowd of his supporters
  broke into the Capitol.

  In November 2022 the Attorney General appointed Jack Smith as Special
  Counsel to investigate. A grand jury indicted Trump on four felony counts in
  August 2023. In July 2024 the Supreme Court held that a president is immune
  from prosecution for some official acts, and the charges were narrowed. Then
  Trump won the November 2024 election. The Justice Department's long-standing
  view is that a sitting president cannot be prosecuted, so the case was
  dismissed.

  Smith delivered this volume to the Attorney General on 7 January 2025, two
  weeks before Trump's second inauguration, and it was made public days later.
  It is the prosecution's case in the prosecutors' own words, never tested at
  trial. Trump's lawyers argued that it should not be released and that it
  violates the presumption of innocence; their letter is printed at the end of
  the report.

findings:
  - text: The Special Counsel concluded the evidence was enough to convict. The case was dropped only because Trump was about to become President again.
    cites: [department-s-view-constitution-prohibits, remand-from-supreme-comi-s]
    excerpt:
      paragraph: department-s-view-constitution-prohibits
      quote: >-
        Indeed, but for Mr. Trump's election and imminent return to the
        Presidency, the Office assessed that the admissible evidence was
        sufficient to obtain and sustain a conviction at trial.

  - text: Trump was told, by his own officials, advisors, state officials and the courts, that there was no fraud that could have changed the result. The report finds he knew he had lost.
    cites: [fraud-and-evidence-shows-trump-used, acknowledged-sounded-crazy-before-publicly, trump-s-intent-spreading-knowing]
    excerpt:
      paragraph: acknowledged-sounded-crazy-before-publicly
      quote: >-
        Finally, at times, Mr. Trump made comments implicitly acknowledging that
        he knew he had lost the election. For example, in a January 3, 2021
        Oval Office meeting regarding a national security matter, Mr. Trump
        stated in part, "[I]t's too late for us. We're going to give that to the
        next guy," meaning President-elect Biden.

  - text: He pressed state officials to set aside the vote count, only in states he had lost and only officials of his own party.
    cites: [one-trump-s-efforts-change, trump-similarly-leaned-other-state]
    excerpt:
      paragraph: trump-similarly-leaned-other-state
      quote: >-
        On January 2, 2021, just days before the election results were to be
        certified, he called Georgia's Secretary of State and pressed him to
        "find 11,780 votes"-Mr. Biden's margin of victory in the state.

  - text: Slates of electors were organised in seven states he had lost, and many of those electors were misled about how their certificates would be used.
    cites: [december-14-the-date-eca-required, most-part-co-conspirators-deceived-trump]

  - text: He tried to put a compliant official in charge of the Justice Department, backing down only when warned of mass resignations.
    cites: [throughout-post-election-period-justice-department, 2021-a-briefing-yielded-nothing-support]

  - text: He pressed Vice President Pence, day after day, to set aside legitimate electoral votes, then turned the crowd against him on January 6.
    cites: [repeated-conversations-day-after-day, trump-has-something-else-left]
    excerpt:
      paragraph: trump-has-something-else-left
      quote: >-
        Then, at 2:24 p.m., sitting alone, Mr. Trump issued a Tweet attacking
        Mr. Pence and fueling the riot: "Mike Pence didn't have the courage to
        do what should have been done to protect our Country and our
        Constitution, giving States a chance to certify a corrected set of
        facts, not the fraudulent or inaccurate ones which they were asked to
        previously certify. USA demands the truth!"

  - text: His public attacks on officials, election workers and, later, witnesses were followed again and again by threats against them.
    cites: [trump-s-resort-intimidation-harassment, trump-also-targeted-private-citizens, same-pattern-transpired-after-trump]

reading_guide:
  - section: the-results-of-the-investigation
    title: The results of the investigation
    why: The whole case in a few pages — what the Special Counsel says happened, and who the six unnamed co-conspirators were.
    excerpt:
      paragraph: set-forth-original-superseding-indictments
      quote: >-
        In service of these efforts, Mr. Trump worked with other people to
        achieve a common plan: to overturn the election results and perpetuate
        himself in office.

  - section: mr-trumps-pressure-on-state-officials
    why: The calls to Arizona, Georgia and Michigan, and what the officials on the other end told him.
    excerpt:
      paragraph: instance-trump-co-conspirator-1-called
      quote: >-
        Co-Conspirator 1 not only failed to ever provide such evidence, but he
        conceded to the Arizona Speaker at an in-person meeting a week later
        that "[w]e don't have the evidence, but we have lots of theories."

  - section: mr-trumps-fraudulent-elector-plan
    why: How electors were organised in seven states he lost, from the planning memos to December 14.
    excerpt:
      paragraph: one-campaign-s-agents-wrote
      quote: >-
        Two and a half hours later, he replied to his own email and, as cover,
        wrote that "'alternative' votes is probably a better term than 'fake'
        votes"

  - section: mr-trumps-supporters-attack-the-united-states-capitol
    why: January 6 hour by hour — the Ellipse speech, the march, and the afternoon in the White House dining room.
    excerpt:
      paragraph: rioters-capitol-had-been-motivated
      quote: >-
        Throughout the afternoon, crowds at the Capitol hunted for Mr. Pence and
        other lawmakers, with some chanting, "Hang Mike Pence!"

  - section: prosecuting-mr-trump-served-multiple-substantial-federal-interests
    why: Why prosecute a former president at all — the prosecutors' argument, including what the police at the Capitol went through.

  - section: mr-trumps-conduct-had-no-historical-analogue
    why: Why this was not like the disputed elections of 1876, 1960 or 2000.
    excerpt:
      paragraph: trump-not-being-prosecuted-publicly
      quote: >-
        Mr. Trump was "not being prosecuted for publicly contesting the results
        of the election; he is being prosecuted for knowingly making false
        statements in furtherance of a criminal conspiracy and for obstruction
        of election certification proceedings."

