report: jack-smith-vol1
status: draft

why_it_matters: >-
  The Special Counsel's account of the attempt to overturn the 2020 election,
  written after the case against Donald Trump was dismissed because he had won
  the 2024 election. The trial never happened. This is the evidence prosecutors
  would have put to a jury, and their conclusion that it was enough to convict.

findings:
  - text: The Special Counsel concluded the admissible evidence was sufficient to convict; the case was dropped only because Mr. Trump was elected President.
    cites: [department-s-view-constitution-prohibits, remand-from-supreme-comi-s]
  - text: Officials in his own Administration, his advisors, state officials and the courts told Mr. Trump there was no outcome-changing fraud; the report finds he knew he had lost.
    cites: [fraud-and-evidence-shows-trump-used, acknowledged-sounded-crazy-before-publicly, trump-s-intent-spreading-knowing]
  - text: He pressed state officials to ignore the vote count, only in states he had lost and only officials of his own party.
    cites: [one-trump-s-efforts-change, trump-similarly-leaned-other-state]
  - text: False slates of electors were organised in seven states, and many of those electors were misled about how their certificates would be used.
    cites: [december-14-the-date-eca-required, most-part-co-conspirators-deceived-trump]
  - text: He tried to put a compliant official in charge of the Justice Department and backed down only when warned of mass resignations.
    cites: [throughout-post-election-period-justice-department, 2021-a-briefing-yielded-nothing-support]
  - text: He pressured Vice President Pence, day after day, to set aside legitimate electoral votes.
    cites: [repeated-conversations-day-after-day, january-4-two-days-before]
  - text: On January 6 he sent the crowd to the Capitol, attacked Pence on Twitter while the riot was under way, and afterwards used the delay to push for more objections.
    cites: [trump-told-crowd-a-crowd-his, trump-has-something-else-left, around-same-time-issued-his]
  - text: Public attacks on officials, election workers and later witnesses were followed, repeatedly, by threats against them.
    cites: [trump-s-resort-intimidation-harassment, trump-also-targeted-private-citizens, same-pattern-transpired-after-trump]

