name: Suggest a report
description: An official report, inquiry or investigation that should be on Reports that Matter. Only the name is needed.
labels: ["report-idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. A name is enough; we check the source, the licence and the size before taking it on. Accepted ideas join the backlog in `reports/pipeline.yaml`, and this issue is linked from there.
  - type: input
    id: link
    attributes:
      label: Link
      description: Where the report is published, if you know.
      placeholder: https://…
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Optional. Why now, who cites it, a date coming up (an anniversary, a hearing, an election).
