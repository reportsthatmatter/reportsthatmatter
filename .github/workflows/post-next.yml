# The scheduled poster (reportsthatmatter-y2t.4): once a day, posts the next due item in
# marketing/queue.yaml to Bluesky and commits `posted_url` back. Bluesky only.
#
# THE BACKUP AND THE WRITE-BACK. The daily post is made by the Cloudflare Worker rtm-poster (workers/poster/,
# 13:47 UTC, retries 14:17 and 14:47), because GitHub starts scheduled runs hours late. A run here (scheduled or
# manual) posts only after 15:00 UTC and only if the Worker did not: normally it finds the Worker's post on the account and
# records posted_url/posted_at in the queue. docs/poster.md.
#
# SAFE BY DEFAULT. It posts nothing unless both exist:
#   secrets   BLUESKY_HANDLE, BLUESKY_APP_PASSWORD
#   switch    marketing/poster-live.yaml says `live: true` (the one switch, shared with the Worker)
# With no secrets it is a dry run that makes no Bluesky request. With the secrets and the switch off it is a dry
# run that logs in and reads the account's recent posts, so it also proves the secrets work.
name: Post next excerpt to Bluesky

on:
  schedule:
    # The post is meant for about 14:00 UTC (10:00 US Eastern in summer, 09:00 after the clocks change on 1 Nov).
    # GitHub starts scheduled runs late, worst at the top of the hour: "0 14 * * *" started 4 to 8 hours late every
    # day from 4 to 16 Oct (gweq). So: off-peak minutes, and several of them. Whichever run starts first from 13:00
    # UTC on posts; the others find today's post and do nothing (one post per UTC day, and a run before 13:00 UTC
    # posts nothing). Each run is cheap. docs/poster.md "When it posts".
    - cron: "47 13 * * *"
    - cron: "17 14 * * *"
    - cron: "47 14 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: show what would be posted, post nothing (unticked, it still posts only if marketing/poster-live.yaml says live: true)"
        type: boolean
        default: true

permissions:
  contents: write

# One poster at a time, so two runs can never both pick the same item.
concurrency:
  group: post-next
  cancel-in-progress: false

jobs:
  post:
    # A fork has no secrets and must not push anywhere.
    if: github.repository == 'reportsthatmatter/reportsthatmatter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The queue must still match the reports (a re-ingest can move a paragraph id). If it does not, the run still
      # records posts already on the account (POSTER_RECORD_ONLY: it never posts), then fails at the end.
      - name: Check the queue against the reports
        id: check
        continue-on-error: true
        run: |
          pnpm prerender
          pnpm posts --check

      - name: Post the next excerpt (or dry-run)
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          # A manual run defaults to a dry run; otherwise the switch file decides ("file": marketing/poster-live.yaml).
          POSTER_LIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'false' || 'file' }}
          # Every live run here leaves 13:00-15:00 UTC to the Worker (crons 13:47, 14:17, 14:47), so the two never race.
          POSTER_NOT_BEFORE: "15:00"
          POSTER_RECORD_ONLY: ${{ steps.check.outcome == 'failure' && '1' || '' }}
        run: pnpm post-next

      # Runs even if the step above failed after posting, so a posted_url is never left uncommitted.
      # If the push fails, the next run finds the post on the account and records it (no double post).
      - name: Commit posted_url back to the queue
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- marketing/queue.yaml; then
            echo "Queue unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/queue.yaml
          git commit -m "chore(posts): record the Bluesky post in the queue (y2t.4)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing onto main."
            git pull --rebase origin main
          done
          echo "::error::Could not push the posted_url commit. The post is on Bluesky; the next run will record it without posting again."
          exit 1

      - name: Fail if the queue check failed
        if: ${{ steps.check.outcome == 'failure' }}
        run: |
          echo "::error::pnpm posts --check failed: nothing was posted (posts already on the account were recorded). Fix the queue (pnpm posts --drop-stale) in a PR."
          exit 1
