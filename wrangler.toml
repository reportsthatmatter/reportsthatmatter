name = "reportsthatmatter"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

rules = [
  { type = "Text", globs = ["**/*.md", "**/*.yaml"], fallthrough = true }
]

# Keep the workers.dev URL alive alongside the custom routes: it is the
# preview/comparison URL and it is what verify.sh points at with VERIFY_BASE.
workers_dev = true

routes = [
  { pattern = "reportsthatmatter.org/*", zone_name = "reportsthatmatter.org" },
  { pattern = "www.reportsthatmatter.org/*", zone_name = "reportsthatmatter.org" },
]

[vars]
REPORTS_SOURCE = "bundled"
# Where the pre-V2 site is readable. Its own subdomain would be nicer, but the
# old.reportsthatmatter.org record still points at a dead Vercel deployment and
# is DNS-only, so a Workers route cannot reach it. GitHub Pages' default URL
# needs no DNS at all and keeps the old URLs alive today.
LEGACY_BASE = "https://reportsthatmatter.github.io/reportsthatmatter"

[assets]
directory = "assets"
binding = "ASSETS"
# The Worker owns routing and delegates /assets/* to the binding itself.
# Without this the asset router runs first and answers unmatched paths — which
# made /health flap between 200 and 404 across edge locations.
run_worker_first = true

[dev]
local_protocol = "http"
