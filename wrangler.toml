name = "reportsthatmatter"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

rules = [
  { type = "Text", globs = ["**/*.md", "**/*.yaml"], fallthrough = true }
]

[vars]
REPORTS_SOURCE = "bundled"

[assets]
directory = "assets"
binding = "ASSETS"
# The Worker owns routing and delegates /assets/* to the binding itself.
# Without this the asset router runs first and answers unmatched paths — which
# made /health flap between 200 and 404 across edge locations.
run_worker_first = true

[dev]
local_protocol = "http"
