name = "reportsthatmatter"
main = "src/index.ts"
# The Datopian account (accounts@datopian.com, Workers Paid; decision 2oz, epic 4g4d, docs/hosting-migration.md).
# Wrangler needs `--profile datopian` until ~/src/reportsthatmatter is bound to that profile; the scripts pass it
# (scripts/lib/migrate-hosting.ts). The old atomatic account's Worker, D1 and R2 were deleted on 2026-10-24 (4g4d.7).
account_id = "83025b28472d6aa2bf5ae59f3724aa78"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

rules = [
  { type = "Text", globs = ["**/*.md", "**/*.yaml"], fallthrough = true }
]

# Keep the workers.dev URL alive alongside the custom routes: it is the
# preview/comparison URL and it is what verify.sh points at with VERIFY_BASE.
workers_dev = true

# The apex and www are Workers custom domains: the Worker owns each hostname and Cloudflare manages its DNS
# record and certificate. A deploy fails (code 100117) while a hand-made or scanned DNS record exists for one of
# them: delete it first. old.* is a zone route instead, because the zone's DNS scan left a proxied record there
# that agents cannot delete (no DNS edit scope); a route works on any proxied record. Once Rufus deletes that
# record it can become a custom domain like the others (docs/hosting-migration.md).
routes = [
  { pattern = "reportsthatmatter.org", custom_domain = true },
  { pattern = "www.reportsthatmatter.org", custom_domain = true },
  { pattern = "old.reportsthatmatter.org/*", zone_id = "9aa68c2e0a324d10a69a117155fe3f11" },
]

[vars]
REPORTS_SOURCE = "bundled"
# Where the Worker fetches the pre-V2 archive it serves on old.reportsthatmatter.org (serveArchive in src/index.ts).
LEGACY_BASE = "https://reportsthatmatter.github.io/reportsthatmatter"
# The public highlights feed (decision 0023, src/lib/feed-policy.ts). "false" stops new rows and shows only the
# Editor's picks; FEED_EXCLUDE adds report ids to the affected-community list held out of the feed. A change here
# needs a deploy; the no-deploy switch is `pnpm feed hide --all --remote --yes`.
FEED_ENABLED = "true"
FEED_EXCLUDE = ""
FEED_DELAY_MINUTES = "30"

[assets]
directory = "assets"
binding = "ASSETS"
# The Worker owns routing and delegates /assets/* to the binding itself.
# Without this the asset router runs first and answers unmatched paths — which
# made /health flap between 200 and 404 across edge locations.
run_worker_first = true

# Social proof (#96): who marked what. One row per share/save event; counts are
# read at render time. `wrangler dev --local` runs this against a local sqlite
# file, migrated automatically — no network access needed to test it.
[[d1_databases]]
binding = "DB"
database_name = "reportsthatmatter-marks"
database_id = "ceb6c2cc-f9a2-414c-8ff5-476da129e7ec"
migrations_dir = "migrations"

# Published report content, addressed by content hash (§3 of
# docs/plans/2026-09-04-content-publishing.md). Reads are per report: a report
# with a row in `report_versions` is served from here, and every other report
# from the deploy's own assets/generated/ — so this binding is inert until
# something publishes.
[[r2_buckets]]
binding = "CONTENT"
bucket_name = "reportsthatmatter-content"

# The running version's id, which changes on every deploy: the edge cache of ?p=/?h= pages is keyed on it, so
# a deploy retires them (reportsthatmatter-h3iu). Free, and needs no read of D1.
[version_metadata]
binding = "CF_VERSION_METADATA"

[dev]
local_protocol = "http"
