  # day itself, not the stadium today, with fair use acceptable. Commons has no
  # 1989 photograph; enwiki's three are fair-use thumbnails (<=391px).
  - title: "A Liverpool fan sits in the empty Hillsborough stadium on 15 April 1989"
    page_url: "https://www.theguardian.com/football/2019/apr/15/liverpool-remembers-hillsborough-victims-on-30th-anniversary-of-disaster"
    image_url: "https://media.guim.co.uk/e16a2b965e4ab7fac5df4346b785ec8b1661145e/0_43_3500_2100/master/3500.jpg"
    credit: "John Giles/PA"
    licence: "Fair use (PA Images copyright; not freely licensed)"
    width: 3500
    height: 2100
    recommended: true
    local_file: "uk-hillsborough-panel/leppings-lane-giles-pa-1989-FAIRUSE.jpg"
    note: "The Leppings Lane end after the crush: empty terrace, perimeter fence, broken advertising boards used as stretchers, one supporter on the wall with his face in his hands (not identifiable). Black and white. The event, with no dead and no face in distress. Shipped as the pilot hero."
  - title: "Hillsborough Stadium, Sheffield (aerial)"
    page_url: "https://commons.wikimedia.org/wiki/File:Sheffield_wednesday_hillsborough_stadium.jpg"
    image_url: "https://upload.wikimedia.org/wikipedia/commons/b/b7/Sheffield_wednesday_hillsborough_stadium.jpg"
