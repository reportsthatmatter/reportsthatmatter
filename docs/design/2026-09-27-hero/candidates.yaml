    note: "The mural/gable end marking the Bogside, the precise location of Bloody Sunday; no violence or injury depicted, widely recognisable, landscape and high-res. Good dignity/specificity balance per the brief's guidance."
  - title: "Bloody Sunday Memorial, Derry"
    page_url: "https://commons.wikimedia.org/wiki/File:Bloody_Sunday_Memorial_Derry.jpg"
