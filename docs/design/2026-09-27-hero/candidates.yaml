litvinenko-inquiry:
  # Shipped pick (2026-09-27, bead cdp.6). An identifiable man in distress in
  # close-up, which the dignity line normally rules out; used because he asked
  # for it to be taken and released, and his family released it. See sources.yaml.
  - title: "Alexander Litvinenko in intensive care, University College Hospital, 20 November 2006"
    page_url: "https://www.theguardian.com/world/2016/jan/21/alexander-litvinenko-was-probably-murdered-on-personal-orders-of-putin"
    image_url: "https://media.guim.co.uk/a02963c081e0b8af4abefb59215ca80d0dfe1f9f/0_266_3872_2324/master/3872.jpg"
    credit: "Natasja Weitsz/Getty Images"
    licence: "Fair use (Getty Images copyright; not freely licensed)"
    width: 3872
    height: 2324
    recommended: true
    local_file: null
    note: "The photograph the family released to the press three days before he died ('I want the world to see what they did to me'). The event itself. Shipped; the grave below is the fallback."
  - title: "Grave of Alexander Litvinenko, Highgate Cemetery"
    page_url: "https://commons.wikimedia.org/wiki/File:LitvinenkoGrave.JPG"
    image_url: "https://upload.wikimedia.org/wikipedia/commons/2/29/LitvinenkoGrave.JPG"
    credit: "JohnArmagh / Wikimedia Commons"
    licence: "Public domain (released by author)"
    width: 3072
    height: 2304
    recommended: false
    local_file: "litvinenko-inquiry/litvinenko-grave-johnarmagh-REC.jpg"
    note: "Landscape orientation, dignified and specific (his actual grave), avoids any poisoning/hospital imagery. Weakest visual link to 'poisoning' as an event but the most respectful and rights-clean option found."
  - title: "Millennium Hotel, Mayfair"
    page_url: "https://commons.wikimedia.org/wiki/Category:Millennium_Hotel_Mayfair"
    image_url: "https://upload.wikimedia.org/wikipedia/commons/Millennium_Hotel,_Mayfair.jpg"
    credit: "unattributed (see Commons category)"
    licence: "unverified, category only"
    width: 640
    height: 480
    recommended: false
    local_file: null
    note: "GAP: this is where the poisoning occurred (bar meeting, 1 Nov 2006) and would be the most specific image, but the only Commons files found are far too small (640x480 and smaller) for a hero banner. Worth a targeted photo request or fair-use news photo if a better one is needed later."

uk-saville-inquiry:
