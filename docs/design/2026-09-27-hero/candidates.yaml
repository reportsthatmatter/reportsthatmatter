    height: 2912
    recommended: true
    local_file: "us-psi-financial-crisis/lehman-brothers-hq-scoble-REC.jpg"
    note: "Taken the actual day Lehman filed for bankruptcy - the single most specific 'this crisis' image available; Lehman collapse is a central subject of the PSI report. Crops well to a wide banner (building facade fills frame)."
  - title: "Sign of the New York Stock Exchange, Broad Street"
    page_url: "https://commons.wikimedia.org/wiki/File:Sign_of_the_New_York_Stock_Exchange,_Broad_Street.jpg"
    image_url: "https://upload.wikimedia.org/wikipedia/commons/7/71/Sign_of_the_New_York_Stock_Exchange%2C_Broad_Street.jpg"
    credit: "Billie Grace Ward / Wikimedia Commons"
    licence: "CC0 1.0"
    width: 4240
    height: 2832
    recommended: false
    local_file: "us-psi-financial-crisis/nyse-sign-ward-ALT.jpg"
    note: "Generic Wall Street identifier rather than crisis-specific; good backup if a less US-bank-specific image is wanted. Night shot, high contrast, crops well."
  - title: "Floor of the New York Stock Exchange (1963)"
    page_url: "https://commons.wikimedia.org/wiki/File:NY_stock_exchange_traders_floor_LC-U9-10548-6.jpg"
