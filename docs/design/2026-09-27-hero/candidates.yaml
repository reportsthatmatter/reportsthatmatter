  # pilot's rule. Fr Edward Daly's white-handkerchief photograph, the day's
  # defining image, shows a dying boy being carried and fails the dignity line.
  - title: "Bloody Sunday: soldiers take cover behind armoured vehicles while using CS gas, 30 January 1972"
    page_url: "https://commons.wikimedia.org/wiki/File:Bloody_Sunday,_Londonderry_1972.jpg"
    image_url: "https://upload.wikimedia.org/wikipedia/commons/1/1a/Bloody_Sunday%2C_Londonderry_1972.jpg"
    credit: "PA"
    licence: "Public domain in the US per Commons (PD-US-no-notice); PA photograph, treated as fair use"
    width: 2600
    height: 1876
    recommended: true
    local_file: null
    note: "Two soldiers behind their armoured vehicles at a barbed-wire barricade, a crowd in CS gas beyond. The event, black and white, no dead, no wounded, no identifiable face. Shipped."
  - title: "Free Derry Corner"
    page_url: "https://commons.wikimedia.org/wiki/File:Free_Derry_corner.JPG"
    image_url: "https://upload.wikimedia.org/wikipedia/commons/9/91/Free_Derry_corner.JPG"
    credit: "Grünen / Wikimedia Commons"
    licence: "CC BY-SA 3.0 (also GFDL 1.2+)"
    width: 3617
    height: 2816
    recommended: false
    local_file: "uk-saville-inquiry/free-derry-corner-gruenen-REC.jpg"
    note: "The mural/gable end marking the Bogside, the precise location of Bloody Sunday; no violence or injury depicted, widely recognisable, landscape and high-res. Good dignity/specificity balance per the brief's guidance."
  - title: "Bloody Sunday Memorial, Derry"
