# Hero image candidates per report (reportsthatmatter-cdp.2)
# `local_file` names the research download (not committed); a shipped hero's
# source is re-fetched from `image_url` by `pnpm heroes` via sources.yaml.
# All free-licence credits verified on the actual Wikimedia Commons file page;
# fair-use entries say so. How to choose: docs/hero-images.md.

