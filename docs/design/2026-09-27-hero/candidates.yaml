    credit: "NASA / Kennedy Space Center"
    licence: "Public domain (NASA)"
    width: 3000
    height: 1955
    recommended: true
    local_file: "columbia-accident/columbia-debris-grid-nasa-REC.jpg"
    note: "Shows the reconstruction-hangar floor grid used to reassemble the orbiter's debris, evoking the scale of the investigation without showing wreckage in a gruesome way. No breakup/contrail photo of comparable resolution and clean licence was found - flagged as a compromise pick tied to the investigation more than the mid-air breakup itself."

