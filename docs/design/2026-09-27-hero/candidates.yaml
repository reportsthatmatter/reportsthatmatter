# Hero image candidates per report (reportsthatmatter-cdp.2)
# `local_file` names the research download (not committed); a shipped hero's
# source is re-fetched from `image_url` by `pnpm heroes` via sources.yaml.
# All free-licence credits verified on the actual Wikimedia Commons file page;
# fair-use entries say so. How to choose: docs/hero-images.md.

jack-smith-vol1:
  - title: "2021 storming of the United States Capitol (DSC09156)"
    page_url: "https://commons.wikimedia.org/wiki/File:2021_storming_of_the_United_States_Capitol_DSC09156_(50826223403).jpg"
    image_url: "https://upload.wikimedia.org/wikipedia/commons/c/cb/2021_storming_of_the_United_States_Capitol_DSC09156_%2850826223403%29.jpg"
    credit: "Tyler Merbler / Wikimedia Commons"
    licence: "CC BY 2.0"
    width: 3009
    height: 1916
    recommended: true
    local_file: "jack-smith-vol1/capitol-storming-merbler-REC.jpg"
    note: "Crowd on the Capitol steps/scaffolding during the 6 Jan 2021 storming; specific, dramatic, clean 16:9-ish crop, no visible injuries. Widely used and clearly rights-cleared Flickr-to-Commons transfer."
  - title: "US Capitol January 6th 2021 during the riot"
    page_url: "https://commons.wikimedia.org/wiki/File:US_Capitol_January_6th_2021_during_the_riot.jpg"
    image_url: "https://upload.wikimedia.org/wikipedia/commons/5/54/US_Capitol_January_6th_2021_during_the_riot.jpg"
    credit: "Kurt Kaiser"
    licence: "CC0 1.0 (public domain dedication)"
    width: 2087
    height: 1565
    recommended: false
    local_file: "jack-smith-vol1/capitol-riot-kaiser-ALT.jpg"
    note: "Alternate crowd/Capitol-front view, fully public domain (CC0), slightly lower resolution and a squarer 4:3 crop than the recommended pick."

us-psi-financial-crisis:
  - title: "Lehman Brothers HQ, New York, 15 Sept 2008"
    page_url: "https://commons.wikimedia.org/wiki/File:Lehman_Brothers-NYC-20080915.jpg"
