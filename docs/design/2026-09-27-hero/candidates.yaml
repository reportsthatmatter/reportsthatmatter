    height: 1777
    recommended: false
    local_file: "uk-saville-inquiry/bloody-sunday-memorial-liger-ALT.jpg"
    note: "The memorial itself, very dignified, but portrait orientation and modest resolution - would need a tight vertical-slice crop for a wide banner, so kept as backup only."

uk-hillsborough-panel:
