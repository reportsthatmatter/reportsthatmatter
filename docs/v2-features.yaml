# V2 working ledger — the state of play.
#
# One entry per feature. `passes` flips to true only when scripts/verify.sh is
# green with that feature in place. Entries are never edited or removed to make
# the goal pass — an entry that cannot be met is marked blocked, with a reason.
#
# Where things live:
#   docs/ROADMAP.md      what we might build and why (the thinking)
#   this file            what is done and what is next (the state)
#   GitHub issues        report candidates — ~28 of them, already curated
#
# ---------------------------------------------------------------------------
# START HERE
# ---------------------------------------------------------------------------
# The site is live at https://reportsthatmatter.org with two reports, the build
# is green, and the working tree is clean. Nothing is half-finished.
#
# The next action is not code. It is launch, and it needs Rufus:
#   1. Google Search Console — verify the domain, submit /sitemap.xml, request
#      indexing on the Jack Smith report. ~10 minutes.
#      Steps: docs/plans/2026-08-02-launch-and-seo.md §2
#   2. Create the @ReportsThatMatter account.
#   3. Post the thread (drafted, ibid. Appendix A). Five cards are rendered.
#
# The best next *code* task is `more-reports` — the pipeline is in good shape
# and the backlog is curated in GitHub issues. Note that the Challenger PDF
# currently lives only in ../challenger-accident/ locally; it needs a repo.
#
# To resume: ./scripts/init.sh   (bootstraps, then runs the full check)

# --- shipped ---------------------------------------------------------------

- id: green-baseline
  desc: A cold checkout installs, typechecks and tests clean
  verify: scripts/init.sh
  passes: true

- id: verification-harness
  desc: One command decides done — types, tests, ingestion, HTTP, browser
  verify: scripts/verify.sh exits 0 (also VERIFY_BASE=<url> against production)
  passes: true

- id: design-system
  desc: Pared-down editorial design, no CDN framework
  verify: browser checks for canvas colour, serif display, nav, no overflow
  passes: true

- id: ingestion-pipeline
  desc: Deterministic PDF → Markdown with automated fidelity gates
  verify: pnpm ingest verify
  passes: true

- id: footnote-layouts
  desc: >
    Both footnote layouts — number inline with its text, and number alone on
    its line with the text beneath. Supporting only the first found 7 notes in
    a document with thousands.
  verify: covered by tests; PSI report yields >1000 notes
  passes: true

- id: jack-smith-published
  desc: Jack Smith Volume One live — 169 pages, 99.2% retained, 229 notes
  verify: /reports/jack-smith-vol1 renders; fidelity checks green
  passes: true

- id: wall-street-reingest
  desc: >
    PSI financial crisis report re-ingested from source — 645 pages, 157
    headings (was 2), 2,725 notes, 98.3% retained.
  verify: entry passes the fidelity gate with ingested:true
  passes: true

- id: permalink-stability
  desc: >
    Paragraph ids derive from the paragraph's opening words, not its position,
    so re-ingesting no longer silently repoints citations. Printed page numbers
    are emitted as #page-N anchors too.
  verify: verify.sh fails if any positional "p-N" id reappears
  passes: true

- id: sidenotes
  desc: Footnotes render beside the sentence they support, collapsing to
    tap-to-open below 68rem
  verify: verify.sh checks for sidenotes on reports that have notes
  passes: true

- id: paragraph-permalinks
  desc: Every body paragraph has a stable id, a ¶ anchor, and highlights on :target
  verify: e2e permalink and :target checks
  passes: true

- id: highlight-to-share
  desc: Selecting text offers a canonical link to the paragraph, or quote plus link
  verify: e2e share popover check
  passes: true

- id: quote-preview-links
  desc: ?p=<id> makes a shared link preview the passage it points at
  verify: /reports/<id>/full?p=<paragraph> sets a quoted meta description
  passes: true

- id: quote-cards
  desc: >
    Curated passages render as PNG share cards; og:image is advertised only
    where a card exists. Regenerate with `pnpm cards`.
  verify: card tests in tests/routes.test.ts
  passes: true

- id: split-reports
  desc: >
    Reports open on a contents page; each section and subsection is its own
    page, with /full kept for searching across a whole report. Largest page
    went from 2.9 MB to ~300 KB. Passage links route to their section.
  verify: verify.sh section checks, including ?p= routing
  passes: true

- id: sitemap
  desc: /sitemap.xml lists every section; /robots.txt points at it
  verify: verify.sh checks both
  passes: true

- id: changelog
  desc: /changelog, hand-written from docs/CHANGELOG.md
  verify: verify.sh checks the page renders
  passes: true

- id: announcement-page
  desc: /about explains the project for campaign traffic
  verify: /about returns 200 with the standfirst copy
  passes: true

- id: brand-mark
  desc: The seal as favicon, header mark and on share cards
  verify: /assets/brand/logo-64.png served; header renders it
  passes: true

- id: deploy
  desc: Live on reportsthatmatter.org, with www redirecting to the apex
  verify: VERIFY_BASE=https://reportsthatmatter.org ./scripts/verify.sh
  passes: true

- id: archive-subdomain
  desc: >
    The pre-V2 site readable at old.reportsthatmatter.org, served by the Worker
    because the DNS record is proxied and GitHub cannot certify it. The old
    site's URLs 301 there.
  verify: old.reportsthatmatter.org/iraq-inquiry/ returns 200
  passes: true

# --- open ------------------------------------------------------------------

- id: search-console
  desc: >
    Verify the domain, submit the sitemap, request indexing. The only place
    that reports which queries we appear for — we have ~3k uniques/month and no
    idea what they came for, and that answer should shape which reports we
    ingest next.
  verify: sitemap shows as submitted; impressions appear within a week
  owner: rufus
  passes: false

- id: launch
  desc: >
    Post the announcement thread and the first excerpts. Everything needed
    exists — thread drafted, five cards rendered, passages in
    docs/share-quotes.yaml.
  verify: the thread is posted and the report is reachable from it
  owner: rufus
  passes: false

- id: footnote-block-leakage
  desc: >
    Fixed by anchoring the block on the expected note number rather than
    searching back from the last candidate — a single stray number at the foot
    of a page used to reject the whole block. Leaked blocks 14 → 3 (Jack Smith)
    and 8 → 1 (PSI); footnote recall 73% → 97%.
  verify: no body paragraph consists mostly of citation strings
  passes: true

- id: page-anchors-both-layouts
  desc: >
    Printed page numbers are taken from a header as well as a footer. The PSI
    report puts them at the top and had zero page anchors as a result; it now
    has 628.
  verify: both reports carry %%page markers
  passes: true

- id: structured-data
  desc: schema.org Report on report pages, BreadcrumbList on sections
  verify: JSON-LD parses and carries isBasedOn provenance
  passes: true

- id: card-anchors-self-heal
  desc: >
    Curated cards carry a `match:` phrase, so when a paragraph id moves (as it
    does whenever ingestion improves) `pnpm cards` re-finds the passage and
    reports the new id instead of failing.
  verify: pnpm cards succeeds after a re-ingest
  passes: true

- id: heading-completeness
  desc: >
    A heading wrapping onto a lowercase line now absorbs it. Truncated headings
    1 → 0 (Jack Smith), 23 → 11 (PSI). The remainder wrap onto capitalised
    lines and are not distinguishable from a following paragraph.
  verify: no heading ends in a preposition or article
  passes: true

- id: design-review
  desc: Rufus reviews the Co-Star-derived design and gives feedback
  verify: human
  owner: rufus
  passes: false

- id: more-reports
  desc: >
    Three published. ~27 candidates remain, curated as GitHub issues — Chilcot
    (#67), Leveson (#32), Saville (#39), FCIC (#57), Valukas (#24), Litvinenko
    (#66), Philip Morris (#33), Duelfer (#34). Each needs a sibling directory
    with the source PDF archived, then `pnpm ingest run`.
    NOTE: challenger-accident's PDF is in ../challenger-accident/ locally and
    has no GitHub repo yet — that needs creating (Rufus, or ask).
  verify: report passes the fidelity gate and appears in the registry
  passes: false

- id: text-out-of-order
  desc: >
    Issue #12 — body text interleaved with footnotes. Checked against the new
    pipeline at the page the issue reported (620 of the PSI report): it now
    reads in order. The issue is fixed but not yet closed — that is Rufus's,
    since it is public.
  verify: page 620 of us-psi-financial-crisis reads as continuous prose
  owner: rufus
  passes: false

