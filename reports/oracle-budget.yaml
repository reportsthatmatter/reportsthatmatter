# Per-report budgets for the layout oracle's precise signals (bead b78.9; docs/quality-harness.md).
#
# Checked by `pnpm ingest verify` (in verify.sh), which needs the source PDFs: the oracle reads the
# PDF's layout, so it cannot run in `pnpm quality`. Each number is the most findings the oracle may
# count for that signal and report; verify fails above it. Counts start at the oracle's counts when
# the budgets were set and only move down: `pnpm ingest verify <id> --ratchet-oracle` lowers a
# report's budgets to its current counts, never up. Raising one is a hand edit with a
# `# why: <bead id>` comment on the line.
#
# Only signals whose precision on the golden pages is high enough to hold a report to (rule in
# docs/quality-harness.md, "Which signals get budgets"): markers-unlinked for every report;
# paragraphs-oversplit for Challenger, Columbia, Leveson and Philip Morris; headings-missed for
# Hillsborough and Leveson; quotes-spurious for Columbia. No budget for paragraphs-merged,
# quotes-missed, headings-spurious or markers-spurious until the oracle reflects the pipeline's
# quote and list conventions.

# `note-off-page` (bead y0w9): the references whose rendered note was printed more than a page from
# the marker, pairing as the renderer does. Budgeted for every report whose notes sit at the foot of
# the page that cites them; the budgets start at the counts at ingest v0.19.0 and only move down.
# Not counted for `notes-at-back` (endnotes at the back of a chapter or the volume, or notes not parsed:
# kgz8), where the note is never on the marker's page. A count is a block's opening page against
# the note's page, so a paragraph the pipeline over-merges across pages adds false findings (Jack Smith).
notes-at-back:
  - us-911-commission
  - us-deepwater-horizon
  - columbia-accident

reports:
  litvinenko-inquiry:
    markers-unlinked: 0  # why: reportsthatmatter-b94 (ingest#46: the oracle counts raised markers in italic lines and out-of-order fragments; read on the page, real)
    note-off-page: 0
  jack-smith-vol1:
    markers-unlinked: 30  # why: reportsthatmatter-4ef1 (layout parse now joins a raised marker overlapping its line; read pp.162 and 169: the Blanche letter's markers are digits glued to words or beside a footnote label in the text layer, real, +3 over b94's 33)
    note-off-page: 11
  us-psi-financial-crisis:
    markers-unlinked: 18  # why: v0.25.0 integration (ingest#74's marker-in-fragment layout fix): the oracle now reads the raised 2 of "CDO²" (PDF pp.400, 486, 548 ...) as a footnote marker. Read on the PDF text layer ("hybrid CDO2 transaction"); it is the squared in the term, not a note. full.md is unchanged (19 CDO^2 and 18 CDO2 before and after), so 2 -> 18 is oracle-side, not a lost link
    note-off-page: 0
  challenger-accident:
    markers-unlinked: 32  # why: reportsthatmatter-n891 (ingest#64: the oracle now reads raised digits on quotation lines too; +5 on pp.60, 64, 67 and two more, text unchanged; 27 before) + jsqw + 4ef1
    paragraphs-oversplit: 372  # why: reportsthatmatter-jsqw (the glossary, PDF pp. 261-262, read one entry a paragraph, is +89; on the other vision pages over-split falls 111 to 65)
    note-off-page: 78  # why: reportsthatmatter-uw50 (page markers move with the folio passes; +1)
  uk-leveson-inquiry:
    headings-missed: 1350
    markers-unlinked: 47
    paragraphs-oversplit: 2082  # why: reportsthatmatter-u00i (footnoteRestarts reads 97 more notes out of the body; +1 oversplit, not in the listed findings)
    note-off-page: 1
  columbia-accident:
    markers-unlinked: 5  # why: reportsthatmatter-n891 (the oracle now reads raised digits on quotation lines too; +2, read on pp.100 and 124: "its resources.”5" and "other Orbiters.10" are real markers the text leaves bare; reportsthatmatter-pfgn)
    paragraphs-oversplit: 277
    quotes-spurious: 235
  us-911-commission:
    markers-unlinked: 6
  us-deepwater-horizon:
    markers-unlinked: 2
  us-v-philip-morris:
    markers-unlinked: 28  # why: reportsthatmatter-b94 (ingest#46: the oracle counts raised markers in italic lines and out-of-order fragments; read on the page, real)
    paragraphs-oversplit: 952
    note-off-page: 0
  uk-hillsborough-panel:
    headings-missed: 70
    markers-unlinked: 1
    note-off-page: 1  # page-foot notes are read since ivg.3 (footnoteNumbers("period")), so it leaves notes-at-back
  uk-saville-inquiry:
    markers-unlinked: 0
    note-off-page: 13  # why: ivg.2 HTML edition puts a note under the paragraph that cites it, so a note can sit on a later page than its marker; the oracle counts these as off-page. Real, not a defect
  uk-chilcot-inquiry:
    markers-unlinked: 0
    note-off-page: 0
  us-lehman-examiner:
    markers-unlinked: 19
    note-off-page: 0
  uk-post-office-horizon-inquiry:
    markers-unlinked: 0
    note-off-page: 0
  us-jan6-committee:
    markers-unlinked: 16  # why: reportsthatmatter-gqsy.3 (markers are linked; the oracle reads them on the page a long list or table row starts on, e.g. 356-359 on p.331 against p.329; its golden-page precision is 0 for every other signal here, so only these two are budgeted)
    note-off-page: 0
  uk-grenfell-tower-inquiry:
    markers-unlinked: 0
    note-off-page: 0
