# Where each unit of report work stands in the preparation pipeline.
#
# Design: docs/design/2026-10-03-report-preparation-pipeline.md §6. Skills:
# .claude/skills/report-*/ (start with report-pipeline).
#
# One row per unit: a report id plus a scope (a further volume of a live
# report is its own unit). `reached` is the last stage whose exit gate is met:
# candidate, source, repo, ingest, evaluate, editorial, publish, announce,
# promote. `state`: active | parked | waiting | ongoing. The owning agent
# updates its row in the PR that meets the gate; nothing else writes it.
# Beads hold the work (who, what next); this file holds how far a unit got and
# where the evidence is.
#
# Seeded 2026-10-03 (ifb5) from artefacts: registry and served reports
# (publish), approved editorial files (editorial), report repos' golden.yaml.
#
# Machine-checked: `pnpm pipeline status` derives each unit's stage from the
# artefacts and `--check` (a warning in verify.sh) fails on drift (ifb5.9;
# scripts/lib/pipeline-status.ts lists every gate item). Only the first row of a
# report id is derived; later rows (more volumes) are record only. Optional keys:
#   waive: {<stage>.<item>: <bead>}  a gate item known to be unmet, owned by that
#                                    bead; the check says when the waiver is stale
#   match: [words]                   how a changelog heading names the report
#                                    (default: its id and registry title)
# Backlog keys, for candidate rows (project 2601, projects/2601-report-backlog-and-status/):
#   title: "..."                     the report's name; required when the id is not in the registry
#   score: {interest, source, size, licence, hook}   each 1-5, null where unchecked (out of 25)
#   hook: "YYYY-MM-DD: why now"      why now, starting with its date where there is one
#   issue: N                         the GitHub issue an older idea came from (before 2026-11-22)
# Ideas not yet triaged are open beads labelled report-idea (bd q "Report idea: <name>" -l report-idea), not rows here. Beads hold work on a
# unit (the `bead:` key), never the backlog or a status. Promote is shown from marketing/queue.yaml.

