# Where each unit of report work stands in the preparation pipeline.
#
# Design: docs/design/2026-10-03-report-preparation-pipeline.md §6. Skills:
# .claude/skills/report-*/ (start with report-pipeline).
#
# One row per unit: a report id plus a scope (a further volume of a live
# report is its own unit). `reached` is the last stage whose exit gate is met:
# candidate, source, repo, ingest, evaluate, editorial, publish, announce,
# promote. `state`: active | parked | waiting | ongoing. The owning agent
# updates its row in the PR that meets the gate; nothing else writes it.
# Beads hold the work (who, what next); this file holds how far a unit got and
# where the evidence is.
#
# Seeded 2026-10-03 (ifb5) from artefacts: registry and served reports
# (publish), approved editorial files (editorial), report repos' golden.yaml.
# Not yet machine-checked: `pnpm pipeline status` is ifb5.9.

