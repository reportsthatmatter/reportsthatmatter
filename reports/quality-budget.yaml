    contents-entry-without-heading: 0.155
    heading-density: 0
    heading-repeated: 0
    heading-function-word: 0.001
    heading-marker: 0
    heading-long: 0.015
    printed-page-reversal: 0
    rendered-h1: 0
    chapter-intro-misfiled: 0
